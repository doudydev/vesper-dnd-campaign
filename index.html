function dSyncInit(){
  var url="";
  try{url=new URLSearchParams(location.search).get("dice")||"";}catch(e){}
  try{
    if(url)localStorage.setItem("vesper:dicesync",url);
    else url=localStorage.getItem("vesper:dicesync")||"";
  }catch(e){}
  var cfgObj=DATA.diceSync;
  url=(url||(cfgObj&&typeof cfgObj==="object"?cfgObj.databaseURL:cfgObj)||
       DICECFG.databaseURL||"").replace(/\/+$/,"");
  if(!url||!/^https:\/\//.test(url))return;
  dSyncUrl=url;
  var room=String(DATA.title||"table").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"table";
  var key="",user="",domain="";
  try{
    var qs=new URLSearchParams(location.search);
    key=qs.get("dkey")||"";user=qs.get("duser")||"";
    /* Remembered the same way the database link is, so a key handed out on the
       URL only has to be clicked once — and never has to sit in the repo. */
    if(key)localStorage.setItem("vesper:dicekey",key);
    else key=localStorage.getItem("vesper:dicekey")||"";
    if(user)localStorage.setItem("vesper:diceuser",user);
    else user=localStorage.getItem("vesper:diceuser")||"";
  }catch(e){}
  var cfg=DATA.diceSync;
  if(cfg&&typeof cfg==="object"){
    key=key||cfg.apiKey||"";user=user||cfg.user||"";domain=cfg.authDomain||"";
  }
  key=key||DICECFG.apiKey||"";user=user||DICECFG.user||"";
  if(!domain){
    /* dice-tracker-bd919-default-rtdb.europe-west1... -> dice-tracker-bd919 */
    var host=url.replace(/^https:\/\//,"").split("/")[0];
    var proj=host.split(".")[0].replace(/-default-rtdb$/,"");
    if(proj)domain=proj+".firebaseapp.com";
  }
  if(key){
    /* Firebase does the checking, so nothing here has to be kept secret. */
    dGateCfg={url:url,key:key,user:(user||"table@vesper.game").trim(),
              gm:(DICECFG.gm||"").trim(),domain:domain||undefined};
    dSyncRoom=room;
    dGateRender();
    dSyncWatch();
    return;
  }
  dSyncRoom=room;dSyncConnect();
}
var dSyncRoom="";
/* If the browser still holds a token from last time, come straight in. */
function dSyncWatch(){
  var base="https://www.gstatic.com/firebasejs/10.12.5/";
  Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js")])
    .then(function(m){
      var app=m[0].getApps&&m[0].getApps().length?m[0].getApps()[0]
             :m[0].initializeApp({apiKey:dGateCfg.key,databaseURL:dGateCfg.url,
                                  authDomain:dGateCfg.domain});
      m[1].onAuthStateChanged(m[1].getAuth(app),function(u){
        if(u&&!dSignedIn){dSignedIn=true;dGateRender();dSyncConnect();}
        if(u&&dGateCfg.gm&&String(u.email||"").toLowerCase()===dGateCfg.gm.toLowerCase())gmBack();
      });
    })["catch"](function(){});
}
function dSyncConnect(){
  var url=dGateCfg?dGateCfg.url:dSyncUrl,room=dSyncRoom;
  var base="https://www.gstatic.com/firebasejs/10.12.5/";
  Promise.all([import(base+"firebase-app.js"),import(base+"firebase-database.js")])
    .then(function(mods){
      var app=mods[0].getApps&&mods[0].getApps().length?mods[0].getApps()[0]
             :mods[0].initializeApp(dGateCfg
                ?{apiKey:dGateCfg.key,databaseURL:url,authDomain:dGateCfg.domain}
                :{databaseURL:url});
      var db=mods[1].getDatabase(app);
      var list=mods[1].ref(db,"vesper/"+room+"/rolls");
      var first=true;
      mods[1].onValue(mods[1].query(list,mods[1].limitToLast(DKEEP)),function(sn){
        var out=[],arriving=[];
        sn.forEach(function(c){
          var v=c.val()||{};v.id=c.key;out.push(v);
          if(dvSeen[c.key])return;
          dvSeen[c.key]=1;
          if(!first&&v.cid!==DCID&&v.f&&v.f.length)arriving.push(v);
        });
        first=false;
        /* Straight onto the table, whatever else is already in the air. At a
           group check everybody rolls at once, and holding one back would be a
           lie about what happened. */
        arriving.forEach(function(v){if(dvReplayable(v))dvThrow(v,null);});
        if(dRolling){dPending=out;return;}
        dLog=out;dTickerRender();dLogRender();
      });
      dSyncPush=function(rec){
        try{rec?mods[1].push(list,rec):mods[1].remove(list);}catch(e){}
      };
      /* Revealed cast. Readable by the table, writable only by the GM account —
         the rules do the enforcing, not this file. */
      var castRef=mods[1].ref(db,"vesper/"+room+"/cast");
      mods[1].onValue(castRef,function(sn){
        var live=[];
        sn.forEach(function(c){var v=c.val()||{};v.id=c.key;live.push(v);});
        applyCast(live);
      },function(){});
      gmPush=function(id,rec){
        /* v38.36: a write the table refuses says so in the GM tab, where it used to do nothing */
        var no=function(e){gmSay("The table refused that ("+String(e&&e.code||e&&e.message||e).slice(0,80)+
          "). Its rules take a title of up to 64 characters and a text of up to 4,000, from the GM account only: if it is neither, sign in again.");};
        gmSay("");
        try{
          var one=mods[1].ref(db,"vesper/"+room+"/cast/"+id);
          var p=rec?mods[1].set(one,rec):mods[1].remove(one);
          if(p&&p["catch"])p["catch"](no);
        }catch(e){no(e);}
      };
      dLog=[];dTickerRender();
      /* The arcade cabinet: vesper/<room>/arcade. on() hands back the way to stop listening; set(path, null) removes;
         gone() removes when this page drops off the table. off is how far this clock is from the table's, for a
         match that two screens must time alike. Until the rules have an "arcade" block the table refuses all of it,
         and the cabinet plays alone. */
      var arcAt=function(p){return mods[1].ref(db,"vesper/"+room+"/arcade/"+p);};
      arcNet={off:0,
        on:function(p,cb){return mods[1].onValue(arcAt(p),function(sn){cb(sn&&sn.val?sn.val():null);},function(){});},
        set:function(p,v,cb){try{(v===null?mods[1].remove(arcAt(p)):mods[1].set(arcAt(p),v)).then(function(){if(cb)cb(1);},function(){if(cb)cb(0);});}catch(e){if(cb)cb(0);}},
        gone:function(p){try{mods[1].onDisconnect(arcAt(p)).remove()["catch"](function(){});}catch(e){}}};
      mods[1].onValue(mods[1].ref(db,".info/serverTimeOffset"),function(sn){arcNet.off=sn&&sn.val?+sn.val()||0:0;},function(){});
      arcNetUp();
    })["catch"](function(){});
}
/* Modifikátor is half again as long as Modifier, and the column is the width
   it is. Rather than pick a size that suits one language and clips the other,
   the caption steps down until it fits. */
function dFitCap(e){
  if(!e)return;
  e.style.fontSize="";e.style.letterSpacing="";
  var px=8.5;
  /* scrollWidth stops growing once the ellipsis kicks in, so the real width is
     taken from a free-standing copy of the text instead */
  var probe=document.createElement("span");
  probe.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;left:-9999px";
  document.body.appendChild(probe);
  var room=e.clientWidth;
  var fits=function(){
    var cs=getComputedStyle(e);
    probe.style.font=cs.font;probe.style.letterSpacing=cs.letterSpacing;
    probe.style.textTransform=cs.textTransform;
    probe.textContent=e.textContent;
    return probe.getBoundingClientRect().width<=room+0.5;
  };
  while(!fits()&&px>5.5){
    px-=0.5;
    e.style.fontSize=px+"px";
    if(px<7.5)e.style.letterSpacing="0";
  }
  probe.parentNode.removeChild(probe);
}

  nm.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();dThrow();}};

/* Enough room under the map to scroll its bottom edge clear of the dice, but
   only when the map is long enough to need it. Otherwise a zoomed-out map
   would sit above a band of nothing. */
function fieldPad(){
  var f=document.querySelector(".field"),st=document.getElementById("stack"),
      dz=document.getElementById("dice");

  var dock=parseFloat(getComputedStyle(document.documentElement)
