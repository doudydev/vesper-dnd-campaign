<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krant Region - Západ</title>
<style>
:root{--void:#07120d;--panel:#0e1e17;--panel2:#14291f;--panel3:#0a1912;
--line:#25453a;--line2:#142a21;--bone:#8fb3a1;--dim:#5c8071;--bright:#cfe8db;
--accent:#4fbf8f;--accent-bg:#16332a;--accent-hi:#8ef0c2;--accent-soft:rgba(79,191,143,.16);
--amber:#c9a44a;--oxide:#c0603a;--trough:#0a1611;--thumb:#2a4d3f;--thumb-hi:#3a6553;
--float:rgba(12,28,21,.95);
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--thumb) var(--trough)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--trough)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid var(--trough)}
::-webkit-scrollbar-thumb:hover{background:var(--thumb-hi)}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--mono);font-size:12px;
line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:baseline;gap:13px;padding:9px 15px;
border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{margin:0;font-size:13px;color:var(--bright);letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.sub{color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.gmlock{background:none;border:1px solid var(--line2);color:var(--line);cursor:pointer;
  font-size:8px;line-height:1;padding:4px 6px;opacity:.5}
.gmlock:hover{opacity:1;color:var(--dim)}
.gmlock.on{color:var(--accent-hi);border-color:var(--accent);opacity:1}
.tabs button.hidden{display:none}
.gmpw{padding:0 0 9px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.gmpw.hidden{display:none}
.gmpw input{flex:1;min-width:0;background:var(--void);border:1px solid var(--line);
  color:var(--bright);font:inherit;font-size:11px;padding:5px 7px}
.gmpw button{background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent-hi);
  font:inherit;font-size:10px;letter-spacing:.1em;padding:5px 9px;cursor:pointer}
.gmfind{width:100%;box-sizing:border-box;background:var(--void);border:1px solid var(--line);
  color:var(--bright);font:inherit;font-size:12px;padding:6px 8px;margin:9px 0 4px}
.gmfind:focus,.gmpw input:focus{outline:none;border-color:var(--accent)}
.gmrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 2px;
  border-bottom:1px solid var(--line2)}
.gmrow .gmkind{grid-column:1;color:var(--accent-hi);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase}
.pcheat article{margin-bottom:20px}
.pcheat h4{margin:0 0 6px;color:var(--accent-hi);font-size:11px;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase}
.pcheat ul{margin:0;padding-left:17px;line-height:1.75}
.pcheat li{margin-bottom:4px}
.gmrow .gmname{color:var(--bright);font-size:11.5px}
.gmrow .gmex{grid-column:1;color:var(--dim);font-size:10px;line-height:1.45}
.gmrow button{grid-column:2;grid-row:1 / span 2;align-self:center;background:none;
  border:1px solid var(--line);color:var(--bone);font:inherit;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 7px;cursor:pointer;white-space:nowrap}
.gmrow button:hover{border-color:var(--accent);color:var(--accent-hi)}
.gmrow button:disabled{opacity:.4;cursor:default}
.gmrow.live{background:var(--accent-soft)}
.gmrow.live .gmname{color:var(--accent-hi)}
.gmnote{color:var(--dim);font-size:10px;padding:6px 0;line-height:1.5;flex-basis:100%}
#gmSay{color:#e9a13b;font-size:11px}#gmSay:empty{display:none}
.gmforget{background:none;border:0;border-top:1px solid var(--line);color:var(--dim);
  font:inherit;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:9px 0;
  cursor:pointer;text-align:left;width:100%;margin-top:10px}
.gmforget:hover{color:var(--oxide)}
.wrap{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0}
.field{position:absolute;inset:0;overflow:auto;padding:16px}
.stack{position:relative;line-height:0;width:max-content}
canvas{display:block;position:absolute;top:0;left:0}
#pix{position:relative;image-rendering:pixelated;image-rendering:crisp-edges}
#lbl{pointer-events:none}
.zoomctl{position:absolute;right:18px;top:18px;z-index:5;display:flex;align-items:stretch;
background:var(--float);border:1px solid var(--line)}
.zoomctl button{background:none;border:0;padding:4px 11px;cursor:pointer;font-size:15px;color:var(--bone)}
.zoomctl button:hover{background:var(--panel2);color:var(--bright)}
.zoomctl button:disabled{opacity:.3;cursor:default}
.zoomctl .zruler{border-right:1px solid var(--line);font-size:14px}
.zoomctl .zruler[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-hi)}
.zoomctl span{padding:0 9px;font-size:10px;color:var(--dim);letter-spacing:.12em;
border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center}
.panel{width:336px;flex:none;background:var(--panel);border-left:1px solid var(--line);
display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex:none;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 30%;min-width:0;white-space:nowrap;background:none;border:0;
border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 4px;
cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.tabs button:last-child{border-right:0}
.wikitop{display:flex;gap:6px;align-items:flex-start}
.wikitop.hidden{display:none}
.wikitop #wikiFind{flex:1;min-width:0}
/* Same box as the search field: a select picks up user-agent metrics unless
   every one of them is restated. */
#wikiCat{flex:none;max-width:46%;box-sizing:border-box;height:auto;line-height:normal;
  background:var(--void);border:1px solid var(--line);color:var(--bone);
  font:inherit;font-size:12px;padding:6px 8px;margin-bottom:10px;
  -webkit-appearance:none;appearance:none;border-radius:0;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                   linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:24px}
#wikiCat:focus{outline:none;border-color:var(--accent)}
#wikiCat option{background:var(--panel);color:var(--bright)}
#wikiFind{width:100%;background:var(--void);border:1px solid var(--line);color:var(--bright);
  font:inherit;font-size:12px;padding:6px 8px;margin-bottom:10px}
#wikiFind:focus{outline:none;border-color:var(--accent)}
.wsec{color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  margin:13px 0 5px;border-bottom:1px solid var(--line2);padding-bottom:3px}
.wsec:first-child{margin-top:0}
.wart{border-left:2px solid var(--line);padding:1px 0 1px 9px;margin-bottom:11px}
.wart.site{border-left-color:var(--accent)}
.wart.unknown{border-left-color:var(--amber)}
.wart.unknown h4{color:var(--amber);letter-spacing:.12em}
.wart .wb.muted{color:var(--dim);font-style:italic}
a.wrow{display:block;text-decoration:none;cursor:pointer;margin-bottom:9px}
a.wrow:hover{border-left-color:var(--accent-hi);background:var(--panel2)}
a.wrow h4{color:var(--bright)}
.wex{color:var(--bone);font-size:11.5px;line-height:1.5;margin-top:3px}
.wex.muted{color:var(--dim);font-style:italic}
.wback{display:inline-block;color:var(--accent);text-decoration:none;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:11px}
.wfull h3{margin:0 0 3px;font-size:15px;color:var(--bright)}
.wfull .wx{margin-bottom:9px}
.wfull .wb{font-size:12.5px;line-height:1.62;white-space:pre-wrap;color:var(--bone)}
.wgoto{display:inline-block;margin-top:13px;color:var(--accent);text-decoration:none;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.wikilink{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.wart .wx a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.wart h4{margin:0 0 3px;font-size:12.5px;color:var(--bright);font-weight:700}
.wart .wx{color:var(--dim);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.wart .wb{color:var(--bone);font-size:12px;line-height:1.55;margin-top:4px;white-space:pre-wrap}
.wnone{color:var(--dim);font-size:12px;line-height:1.5}
.measurebox{position:absolute;left:12px;top:12px;z-index:6;width:216px;background:var(--float);
  border:1px solid var(--line);padding:9px 11px 11px;font-size:11.5px;color:var(--bone)}
.measurebox.hidden{display:none}
.mb-h{color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}
.measurebox .mb-r{display:flex;justify-content:space-between;gap:8px;margin:2px 0}
.measurebox .mb-r b{color:var(--bright);font-weight:600}
.stage{position:relative}
.tabs button:hover{color:var(--bone);background:var(--panel2)}
.tabs button[aria-pressed="true"]{color:var(--bright);background:var(--accent-bg);
box-shadow:inset 0 -2px 0 var(--accent)}
.pane{flex:1;overflow-y:auto;padding:15px;min-height:0}
.measurebox{position:absolute;right:18px;top:62px;z-index:5;width:210px;
background:var(--float);border:1px solid var(--line);padding:9px 11px;line-height:1.55}
.measurebox .mb-h{color:var(--bright);letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;margin-bottom:5px}
.measurebox .mb-r{display:flex;justify-content:space-between;gap:9px;font-size:11px}
.measurebox .mb-r b{color:var(--bright)}
.measurebox .mb-warn{color:var(--oxide);margin-top:5px;font-size:10.5px}
.measurebox .mb-hint{color:var(--dim);margin-top:5px;font-size:9.5px}
.hidden{display:none}
.dir{margin:0 0 20px}
.dir:last-child{margin-bottom:6px}
.dirdate{color:var(--amber);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.dir h3{margin:0 0 7px;font-size:14px;color:var(--bright);font-weight:600;line-height:1.35}
.dirimg{max-width:100%;height:auto;display:block;margin-top:6px;border:1px solid var(--line)}
.dirbody{white-space:pre-wrap;line-height:1.65}
.dir audio{width:100%;margin-top:9px;filter:invert(.9) hue-rotate(170deg)}
.dir img.dirimg{display:block;max-width:100%;margin-top:9px;border:1px solid var(--line)}
.dirtag{color:var(--amber);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}
.dirsep{border:0;border-top:1px solid var(--line);margin:0 0 18px}
.dirzoom{display:block;position:relative;width:100%;margin:9px 0 0;padding:0;border:1px solid var(--line);
  background:var(--void);cursor:zoom-in;font:inherit;color:inherit;text-align:left}
.dirzoom img.dirimg{display:block;width:100%;margin:0;border:0}
.dirimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:9px}
.dirimgs .dirzoom{margin:0}
.dirimgs img.dirimg{aspect-ratio:4/3;object-fit:cover}
.dirzoom:hover,.dirzoom:focus-visible{border-color:var(--accent);outline:none}
.dirzhint{position:absolute;right:0;bottom:0;background:var(--float);color:var(--accent-hi);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dirplay{display:flex;align-items:center;gap:10px;width:100%;margin-top:9px;padding:10px 12px;
  background:var(--panel3);border:1px solid var(--line);color:var(--bright);font:inherit;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;text-align:left;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.dirplay:hover,.dirplay:focus-visible{border-color:var(--accent);color:var(--accent-hi);outline:none}
.dirplay:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
.ic-play{display:inline-block;flex:none;width:0;height:0;border-left:10px solid currentColor;
  border-top:6px solid transparent;border-bottom:6px solid transparent}
.ic-pause{display:inline-block;flex:none;width:10px;height:12px;border-left:3px solid currentColor;border-right:3px solid currentColor}
.ic-stop{display:inline-block;flex:none;width:10px;height:10px;background:currentColor}
.lbov[hidden],.rov[hidden]{display:none}
.lbov{position:fixed;inset:0;z-index:300;background:rgba(3,8,6,.95);display:flex;flex-direction:column}
.lbstage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.lbstage.drag{cursor:grabbing}
.lbimg{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.lbimg.px{image-rendering:crisp-edges;image-rendering:pixelated}
.lbhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:92%;background:var(--float);
  border:1px solid var(--line);color:var(--bone);font-size:10px;letter-spacing:.08em;padding:5px 10px;
  pointer-events:none;transition:opacity .7s;text-align:center}
.lbbar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel)}
.lbtitle{flex:1;min-width:0;color:var(--bright);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbbar button,.lbbar a{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:36px;
  padding:0 10px;background:var(--panel2);border:1px solid var(--line);color:var(--bone);font:inherit;font-size:15px;
  cursor:pointer;text-decoration:none}
.lbbar a{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.lbbar button:hover,.lbbar a:hover,.lbbar button:focus-visible,.lbbar a:focus-visible{border-color:var(--accent);color:var(--accent-hi);outline:none}
.lbpct{flex:none;min-width:46px;text-align:center;color:var(--dim);font-size:10px}
.rov{position:fixed;inset:0;z-index:300;background:rgba(3,8,6,.74);display:flex;align-items:center;justify-content:center;padding:14px}
.rbox{width:min(626px,100%);max-width:100%;background:#0b130f;border:3px solid #2c4236;padding:10px;
  box-shadow:0 0 0 3px #000,9px 9px 0 3px rgba(0,0,0,.55);animation:rpop .32s steps(5) both}
@keyframes rpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rtag{flex:none;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}
.rtag::before{content:"";width:8px;height:8px;background:currentColor}
.rtag.on{color:#e0603a}
.rtag.on::before{animation:rblink 1s steps(2) infinite}
@keyframes rblink{50%{opacity:.15}}
.rtitle{flex:1;min-width:0;color:var(--bright);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:42px;height:36px;padding:0 11px;
  background:#14291f;border:2px solid #2c4236;color:var(--bright);font:inherit;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 #000}
.rbtn:hover,.rbtn:focus-visible{border-color:var(--accent);color:var(--accent-hi);outline:none}
.rbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.rcan{display:block;position:static;width:100%;height:auto;margin:0 auto;background:transparent;image-rendering:crisp-edges;image-rendering:pixelated}
.rbar{position:relative;height:14px;margin:10px 0 9px;background:#03100a;border:2px solid #2c4236;cursor:pointer;touch-action:none}
.rfill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#4fbf8f 0 6px,#23573f 6px 8px)}
.rctl{display:flex;align-items:center;gap:9px}
.rtime{margin-left:auto;color:var(--accent-hi);font-size:12px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.rmsg{color:#e0603a;font-size:10.5px;margin-top:7px}
.rmsg:empty{display:none}
/* the broadcast radio: same frame as the field radio, its own receiver */
.bcov{z-index:310}
.bcov[hidden]{display:none}
.bcbox{width:min(560px,100%)}
.bcfoot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--dim);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.bcsnd{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.bcpill{position:fixed;left:14px;top:58px;z-index:305;background:var(--float);border:1px solid #e0603a;
  color:#e0603a;font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;cursor:pointer}
.bcpill[hidden]{display:none}
.gmlive{padding:0 0 10px;margin-bottom:9px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gmlive.hidden{display:none}
.gmfx{display:contents}
.gmfx.off{display:none}
.gmlive:not(:has(.gmfx:not(.off),.gmfxrow)){display:none}
#gmFxMore{display:contents}
.gmfxrow,.fxrow{flex-basis:100%;display:flex;align-items:center;gap:6px}
.fxrow .gmgo:not([hidden])+.gmgo{margin-left:0}
#gmSfx{flex-wrap:wrap;gap:4px 6px;margin-top:4px}
#gmSfx:not(.gmfxrow){display:none}
#gmSfx .gmgo{margin-left:0}
#sxVol,#bcVol{width:84px;accent-color:var(--accent)}
#sxBtns{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sxg{flex-basis:100%;color:var(--dim);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.sx{padding:3px 7px;font-size:10.5px}
#sxNote:empty{display:none}
.axbox{position:fixed;inset:0;z-index:410;background:#000}
.axbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.gmlh{flex-basis:100%;color:var(--accent-hi);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase}
.gmchk{display:flex;align-items:center;gap:5px;color:var(--bone);font-size:10.5px;cursor:pointer}
.gmgo{margin-left:auto;background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent-hi);
  font:inherit;font-size:11px;padding:5px 10px;cursor:pointer}
.gmgo.on{background:rgba(224,96,58,.16);border-color:#e0603a;color:#e0603a}
/* the rocket trail: covers the whole page while it plays */
.rkov{position:fixed;inset:0;z-index:400;background:#000;display:flex;align-items:center;justify-content:center}
.rkov[hidden]{display:none}
.rkov canvas{display:block;position:static;width:min(100vw,177.78vh);height:min(100vh,56.25vw)}
.rkov .rbtn,.axx{position:absolute;top:12px;right:12px;opacity:.25;cursor:pointer}
.rkov .rbtn:hover,.rkov .rbtn:focus-visible,.axx:hover,.axx:focus-visible{opacity:1}
.rkov .rksnd{right:66px;opacity:.7}
.rkov .rbtn[hidden]{display:none}
/* the drone record: the rocket's overlay; once it has run, a player's bar under it */
.dfov .dfrev{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 6px;padding:0 14px;
  color:#8fa3d8;font-size:10px;letter-spacing:.16em;text-transform:uppercase;animation:dfin .6s}
@keyframes dfin{from{opacity:0}}
.dfov .dfrev[hidden]{display:none}
.dfov .dfrev i{flex-basis:100%;height:0}
.dfov .dfrev .rbtn{position:static;opacity:.75;min-width:36px;padding:0 8px}
.dfov .dfrev .rbtn:disabled{opacity:.25;cursor:default}
.dfov .dfrev .dfn.on{opacity:1;border-color:#8fa3d8;color:#fff}
.dfov .dfs{flex:1 1 80px;max-width:420px;margin:0 6px;accent-color:#8fa3d8;cursor:pointer}
.dfov .dft{min-width:19em;white-space:nowrap}
.dfov .dfgx{left:12px;right:auto;opacity:.6;font-size:11px}
.dfpill{top:92px}
/* the arcade cabinet: css */
.arcpill{top:126px}
.arcsel{background:var(--void);border:1px solid var(--line);color:var(--bone);font:inherit;font-size:10.5px;padding:2px}
.arcgl{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 12px}
/* The page stays behind it at a quarter of its light. The cabinet is seen from the front: a lit marquee, the tube set back
   between the side walls, and the control deck a floor that slopes out at you (one turn about its far edge, in perspective).
   Everything is in units: the cabinet is 100 wide, the deck's near edge 104. */

/* the arcade cabinet: css end */
.gmgo[hidden]{display:none}
.hexlink{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
.hexlink:hover{color:var(--accent-hi);background:var(--accent-soft)}
.coord{color:var(--bright);letter-spacing:.22em;font-size:18px}
.meta{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;margin-bottom:11px}
.site{color:var(--bright);font-size:14px;margin-bottom:7px}
.brief{color:var(--bone);white-space:pre-wrap}
.rule{border:0;border-top:1px solid var(--line);margin:13px 0}
.pbtn{background:var(--panel2);border:1px solid var(--line);padding:6px 9px;cursor:pointer;
letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--bone);width:100%;margin-top:9px}
.pbtn:hover{border-color:var(--dim);color:var(--bright)}
.muted{color:var(--dim)}
.lgd{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:10.5px}
.lsec{color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  margin:13px 0 5px;border-bottom:1px solid var(--line2);padding-bottom:3px}
.lsec:first-child{margin-top:0}
.lgrid{display:flex;flex-direction:column;gap:3px}
.lgd i.chip{width:15px;height:12px;flex:none;border:1px solid rgba(0,0,0,.5);display:block}
.lgd i.chip.unk{background:repeating-linear-gradient(-45deg,var(--line) 0 2px,transparent 2px 5px);
  border-color:var(--line)}
.lgd i.gly{width:15px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-style:normal;line-height:1;border:0}
.lgd i.ln{width:15px;height:12px;flex:none;display:flex;align-items:center;border:0}
.lgd i.ln b{display:block;width:100%;height:3px}
.lgd span{min-width:0}
/* identical to the editor masthead: same size, tracking, colour */
.wm{color:var(--bright);letter-spacing:.34em;text-transform:uppercase;font-size:13px}
.wdiv{color:var(--dim);margin:0 9px 0 5px;letter-spacing:0}
#hTitle{color:var(--bright);font-size:13px;letter-spacing:.06em;text-transform:none;font-weight:400}
h1{display:flex;align-items:baseline}
.spacer{flex:1}
/* One group, right-aligned, both rows the same height so they line up
   regardless of the header's baseline alignment. */
.hctl{display:flex;align-items:center;gap:10px;margin-left:12px;align-self:center}
.locsel{display:flex;height:19px;border:1px solid var(--line)}
.locsel button{background:none;border:0;color:var(--dim);font:inherit;font-size:10px;
  letter-spacing:.1em;padding:0 8px;cursor:pointer;line-height:17px}
.locsel button+button{border-left:1px solid var(--line)}
.locsel button[aria-pressed="true"]{background:var(--accent-bg);color:var(--bright)}
.pthemes{display:flex;gap:4px;align-items:center;height:19px}
.pthemes button{width:17px;height:17px;border:1px solid var(--line);cursor:pointer;padding:0;
  display:block}
.pthemes button[aria-pressed="true"]{border-color:var(--bright);box-shadow:0 0 0 1px var(--bright)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
/* ---- dice ---------------------------------------------------------
   A tray in the bottom corner of the map and a strip of recent results
   beside it, so the table can see who threw what without leaving the map. */
.dice{position:absolute;left:14px;right:14px;bottom:14px;z-index:7;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dice>*{pointer-events:auto}
.dicerow{display:flex;align-items:flex-end;gap:10px}
.dicebar{flex:1;min-width:0;display:flex;background:var(--float);border:1px solid var(--line)}
.dexp{flex:none;width:25px;background:none;border:0;border-right:1px solid var(--line);
  color:var(--dim);cursor:pointer;font-size:8px;font-family:var(--mono)}
.dexp:hover{color:var(--bright);background:var(--panel2)}
.dexp[aria-expanded="true"]{color:var(--accent-hi);background:var(--accent-bg)}
.dticker{flex:1;min-width:0;display:flex;align-items:center;gap:17px;
  overflow-x:auto;overflow-y:hidden;padding:7px 11px;scrollbar-width:none}
.dticker::-webkit-scrollbar{height:0}
.dnone{color:var(--dim);font-size:10.5px;letter-spacing:.1em;white-space:nowrap}
.dent{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;font-size:12px}
.dwho{font-style:normal;color:var(--bone);max-width:9em;overflow:hidden;text-overflow:ellipsis}
.dtot{color:var(--bright);font-size:16px;font-weight:700;min-width:1.1em;text-align:center}
.dnota{font-style:normal;color:var(--dim);font-size:10px;letter-spacing:.05em}
.dent.crit .dtot{color:var(--accent-hi)}
.dent.fumble .dtot{color:var(--oxide)}
.dfaces{display:flex;gap:3px}
.dface{font-style:normal;display:flex;align-items:center;justify-content:center;
  min-width:19px;height:19px;padding:0 3px;font-size:11px;color:var(--dim);
  border:1px solid var(--line);background:var(--panel3)}
.dface.set{color:var(--bright);border-color:var(--thumb-hi)}
.dent.rolling .dtot{color:var(--dim)}
.dent.landed .dtot{animation:dpop .42s ease-out}
@keyframes dpop{0%{transform:scale(1.55);color:var(--accent-hi)}100%{transform:none}}
.dtray{flex:none;width:216px;background:var(--float);border:1px solid var(--line);
  padding:7px 8px 8px;display:flex;flex-direction:column;gap:6px}
.dtop{display:flex;gap:6px;align-items:center}
#dName{flex:1;min-width:0;background:var(--void);border:1px solid var(--line);
  color:var(--bright);font:inherit;font-size:11px;padding:4px 6px}
.dswatch{flex:none;width:21px;height:21px;padding:0;cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:0}
.dswatch::-webkit-color-swatch-wrapper{padding:2px}
.dswatch::-webkit-color-swatch{border:0}
.dswatch::-moz-color-swatch{border:0}
#dName:focus{outline:none;border-color:var(--accent)}
.dmin{flex:none;width:21px;height:21px;background:none;border:1px solid var(--line);
  color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:13px;line-height:1;padding:0}
.dmin:hover{color:var(--bright);border-color:var(--dim)}
.dsel{display:flex;align-items:center;gap:4px}
.hyear{color:var(--accent);letter-spacing:.16em}
.dfield{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dfield:last-child{flex:1.45}
.dfield>span{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfield select{flex:none;width:100%}
.dsel select{flex:1;min-width:0;background:var(--void);color:var(--bright);
  border:1px solid var(--line);font:inherit;font-size:11px;padding:4px 3px;cursor:pointer;
  -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.dsel select:focus{outline:none;border-color:var(--accent)}
.dsel option{background:var(--panel);color:var(--bright)}
.dgate{display:flex;flex-wrap:wrap;gap:5px}
.dgate.hidden{display:none}
#dPass{flex:1;min-width:0;background:var(--void);border:1px solid var(--line);
  color:var(--bright);font:inherit;font-size:11px;padding:4px 6px}
#dPassGo{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--bone);

.dgatemsg{flex:0 0 100%;font-size:10px;color:var(--oxide);min-height:12px}

.droll{background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent-hi);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  padding:8px 4px;cursor:pointer}
.droll:hover{background:var(--accent);color:var(--void)}
.droll:disabled{opacity:.45;cursor:default}
.dshow{display:none;align-self:flex-end;background:var(--float);border:1px solid var(--line);
  color:var(--bone);font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 12px;cursor:pointer}
.dshow:hover{color:var(--bright);border-color:var(--dim)}
.dice.min .dicerow,.dice.min .dlog{display:none}

.dlog{background:var(--panel);border:1px solid var(--line);max-height:238px;overflow-y:auto}
.dlog .drow{display:flex;align-items:center;gap:9px;padding:5px 11px;font-size:11.5px}
.dlog .drow+.drow{border-top:1px solid var(--line2)}
.dlog .dtime{font-style:normal;color:var(--dim);font-size:9.5px;flex:none;width:44px}
.dlog .dwho{flex:1;min-width:0;max-width:none}
.dlog .dfl{font-style:normal;color:var(--dim);font-size:10px;flex:none}
.dlog .dtot{font-size:14px;min-width:3ch;text-align:right}
.dlog .dnota{min-width:7ch;text-align:right}
.dlog .drow.crit .dtot{color:var(--accent-hi)}
.dlog .drow.fumble .dtot{color:var(--oxide)}
.dlogfoot{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;
  border-top:1px solid var(--line)}
.dclear{background:none;border:0;color:var(--dim);font:inherit;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.dclear:hover{color:var(--oxide)}
.dboard{color:var(--dim)}
.dboard.on{color:var(--accent)}
.dboard:hover{color:var(--bright)}
/* the throw itself: a canvas laid over the map, only painted mid-throw */
.dvcan{position:absolute;inset:0;z-index:6;pointer-events:none;display:none}
.dvcan.on{display:block}
/* ---- narrow screens ------------------------------------------------

   the body slides up over the map, so the map keeps the whole screen
   until you actually ask for a briefing. */
.sheetgrip{display:none;align-items:center;justify-content:center;height:21px;flex:none;
  background:var(--panel);border:0;border-bottom:1px solid var(--line2);cursor:pointer;padding:0}

  .droll{flex:1 1 96px}

"t":"ash","k":"blue","r":2},"12,19":{"t":"ash","k":"blue","r":2},"13,19":{"t":"ash","k":"blue","r":2},"14,19":{"t":"ash","k":"blue","r":2},"15,19":{"t":"ash","k":"blue","r":2},"16,19":{"t":"ash","k":"blue","r":2},"17,19":{"t":"ash","k":"blue","r":2},"18,19":{"t":"tundra","k":"blue","r":2},"19,19":{"t":"tundra","k":"blue","r":2},"20,19":{"t":"ash","k":"blue","r":2},"21,19":{"t":"forest","k":"blue","r":2},"22,19":{"t":"forest","k":"blue","r":2},"23,19":{"t":"forest","k":"blue","r":2},"24,19":{"t":"forest","k":"blue","r":2},"25,19":{"t":"ash","k":"blue","r":2},"26,19":{"t":"ash","k":"blue","r":2},"27,19":{"t":"ash","k":"blue","r":2},"28,19":{"t":"tundra","k":"blue","r":2},"29,19":{"t":"tundra","k":"blue","r":2}},"directives":[{"date":"","title":"Ranní zprávy pro týden · Hlas Republiky","body":"• Ministerstvo zemědělství a výživy oznámilo zásadní pokrok ve výzkumu [Zhouba|Zhouby]. Podrobnosti jsou tajné.\n• Ministr Havelka: „Republika nenechá Krant a Occasii hladovět. Jaro bude naše.“\n• Pšenice na agarpolské burze zlevnila za jediné odpoledne o čtvrtinu.\n• Kolvath obviňuje Republiku z „teroristického útoku a zločinu proti lidskosti“ v [Šedá Zóna|Šedé zóně]: údajně šest mrtvých a jeden unesený technik. Ministerstvo obrany: kolvathská propaganda.\n• Smíšená komise pro dohled nad [Agarpolis Dohoda|příměřím] zasedá příští měsíc v Agarpoli.\n• [Rumea]: Severní velitelství [VzSO] hlásí odražený kombinovaný útok u Lessenu. Generál Ivančuk žádá rychlejší tendr na nové válečné stroje.\n• Zhouba se vrátila na jih Occasie. Kraje slibují vyšší příděly chleba a mouky, lidé přesto demonstrují v ulicích.\n• Senát bude hlasovat o rozpočtu a o stanném právu v [Krant|Krantu] po konci příměří v roce 2377.\n• Ministerstvo vnitra pozastavilo všechna povolení k cestám do [Šedá Zóna|Šedé zóny].\n• Uprchlíci: [1711|Kemp Liptus] pálí vlastní sýpky, na západním břehu Krantu jsou vidět podivná světla.\n• Počasí pro Krant: mráz a sníh, v noci −5 až −10 °C.","id":"d_s7news"},{"date":"Session #4","title":"Kazeta B","body":"","id":"dmv5ffo1i","media":{"src":"audio/ejlxgpemv4.mp3","kind":"audio"}},{"date":"Session #3","title":"Schéma Kolvasie - Náčrt","body":"","id":"dmt98g0gb","media":{"src":"image/relxw7dmv4.png","kind":"image"}}],"wiki":{"entries":[{"t":"Lessen","c":"Geography","b":"Před poslední válkou byl Lessen hraničním centrem obchodu mezi Kolvathem a Occasií. Díky svému umístění se postupem času rozšířilo v metropolitní město a dosáhlo statusu krajského města. Za války zde operuje 3. Okasijská armáda a vede z Lessenu obranu Rumei"},{"t":"Šedá Zóna","c":"Geography","b":"Nárazníková zóna která se táhne napříč [Krant|Krantem] o výšce zhruba 70km podél celé jeho šíře. Po demilitarizaci obou stran v rámci [Agarpolis Dohoda|Agarpolis Dohody] zde vzniklo vakuum které zaplnilo bezpráví a lovci příležitostí. Počet obyvatel zůstalých v zóně se odhaduje v nízkých milionech primárně koncentrovaných v ruinách metropolitních center a venkovských enkláv."},{"t":"Rumea","c":"Geography","b":"Východní region na Vesperu, Rumea je jedním z dvou zemských koridorů spojující [Kolvath] a [Occasia|Ocassii]. Na šíři má délku 1521km. Oplývá velkou diverzitou planin, vysočin a lesů protkaných meandry a skalními útvary."},{"t":"Agarpolis Dohoda","c":"History","b":"Jmenovaná dle Occasijské metropole na severním [Krant|Krantu] ve kterém byla tato dohoda o příměří podepsána 24. srpna 2372 mezi [Kolvath|Kolvathem] a [Occasia|Occasií]. Podmínky dohody stanovily 5 let zemského příměří v Krantu ode dne podpisu smlouvy. Příměří se týká i námořních a vzdušných operací nad Krantem včetně průzkumných operací. Konvenční konflikt v [Rumea|Rumei] nadále pokračuje. Dohoda ustanovila vznik nárazníkové zóny lidově známá jako \"[Šedá Zóna]\" mezi oběma státy o minimální vzdálenosti 70km a její převážné demilitarizaci. Obě strany se shodly, že fronta na Krantu se dostala do bodu mrazu a žádná strana neměla navrch. Pro obě strany vypadá, že se fronta znova otevře po skončení příměří, nové zásobovací linie a obranné základny jsou uváděny to provozuschopného stavu."},{"t":"Poslední válka","c":"History","b":"Ozbrojený konflikt mezi [Kolvath|Kolvathem] a [Occasia|Ocasiií] který začal předběžným útokem ze strany [Kolvath|Kolvathu] v roce 2347 v reakci na kontaminační únik [Zhouba|Zhouby] ze [Stanice Kestrel] v roce 2346 a následnému rozpadu diplomatických relací kvůli způsobené rozsáhlé neúrodě a hladomoru. Ačkoliv se nepodařilo zjistit přesnou příčinu úniku a zda-li v tom figurovaly zpravodajské složky z obou stran ([BSO] nebo [MZK]), relace již byly na bodu mrazu před vypuknutím otevřeného boje a obě strany aktivně zbrojily dekády proti sobě. Názvu \"Poslední válka\" získal tento konflikt primárně jeho velikostí a počtem obětí a zkázy. Odhadem expertů zahynulo mezi oběma stranami v přepočtu 1 bilión obyvatel a dalších 2 bylo vysídleno z postihnutých oblastí. Přestože se válka přesouvá do 30. výročí svého trvání, obě strany nejsou ochotny přistoupit k ukončení bojů vyjma krátkodobého příměří v rámci [Agarpolis dohoda|Agarpolis dohody]."},{"t":"VzSO","c":"History","b":"Vzdušné síly Occasie (zkr. VzSO) jsou jedním ze tří branží centrálního velení ozbrojených sil. Rozdělené na dvě velitelství, Severní a Jižní, primární offenzivní kapacity jsou koncentrovány na severu proti Kolvathu. Jižní velitelství zařizuje logistické zázemí, údržbu flotily a search & rescue operace. Pod VzSO spadají i raketové síly, pozičně situovány na jihu daleko od dosahu strategických bombardérů Kolvathu."},{"t":"Projekt Arcturus","c":"History","b":"Zahájen v roce 2310 po dekádovém summitu mezi Occasií a Kolvathem za účelem eradikace [Zhouba|Zhouby], byla to dosud největší socio-ekonomicko-vědecká spolupráce mezi oběma státy. Kooperace vyústila v sérii labolatoří postavených v [Krant] regionu a značném sdílení civilních technologií obou stran. Po kontaminačním úniku experimentálních prvků [Zhouba|Zhouby] (příčina neznámá) v roce 2346 a následné ekologické katastrofě byla spolupráce pozastavena a po vypuknutí [Poslední válka|Poslední války] o rok později natrvalo zatracena."},{"t":"Vesper","c":"Geography","b":"Systém Aurelius\nHlavní hvězda: Aurelius, žlutá hvězda hlavní posloupnosti spektrální třídy G2V\nVzdálenost od Arcturu: přibližně 4.1 světelného roku\nPlaneta: Vesper, třetí hlavní planeta systému\nOběžná dráha: 1.00 AU\nRok: Přibližně 365 dní\n\n-Geografie-\nVesper je rozlehlá oceánská superplaneta s nezvykle nízkou průměrnou hustotou a povrchovou gravitací blízkou jednomu standardnímu g. Její nitro ukrývá hluboký, na vodu bohatý plášť, nad nímž leží poměrně tenká a rozlámaná kontinentální kůra.\n\nPovrchu světa dominuje Vesperský oceán: chladný, téměř celoplanetární oceán přerušovaný vulkanickými souostrovími, podmořskými hřbety a dvěma hlavními pevninami — Cassem na jihu a Brumou na severu. Cassus je starší, a mírnější kontinent; historické centrum osídlení, zemědělství a lehkého průmyslu. Bruma je obdobná tvarem, avšak značně chladnější: severní štít vysokých plošin, fjordových pobřeží, vnitrozemských moří a sezónního ledu. S Cassem jsou spojeni zemsky mezi dvěma regiony [Krant] a [Rumea]."},{"t":"Occasia","c":"Geography","b":"Occasia (vysloveno Okásie - officiálně Occasijská Republika), je megastátem na jižním polokouli [Vesper|Vesperu] na kontinentu [Cassus]. Na dlouhou historii Vesperu je to mladá republika která vznikla po dlouhém procesu diplomacie mezi městskými státy a kraji v roce 1975 za účelem spolupráce a prosperity. Occasii vyneslo do dob prosperity hlavně pokrok v námořních technologiích, průlom v těžbě v hlubokých vodách, investice do rozšíření biotechnologií a agrárního průmyslu díky nimž populace republiky vyrostla z 1 do 3 biliónů za pouhých 150 let. Lehký průmysl, zemědělství, a výroba a výzkum špičkových technologií jsou výhradně silnou stránkou Occasie která využila jejich potenciálu k podpoře rostoucího obyvatelstva a armády."},{"t":"Kolvath","c":"Geography","b":"Kolvath (oficiálně Federativní Republika Kolvath), je megastát nacházející se na severní polokouli [Vesper|Vesperu] na kontinentě Bruma. První zmínky o vzniku federace sahají zpátky do roku 2050 kdy první pokroky v technologiích umožnilo prvním osadníkům dalekosáhlé výpravy na mrazivý sever Brumy a založení prvních permanentních osad. V rámci vývoje za poslední dvě století se Kolvath přeměnil primárně v centrálně řízenou republiku a federace zůstala jménem. Kolvath obývá zhruba 2.5 biliónů obyvatel (předválečný cenzus) primárně na jeho jižní části sousedící s Occasií. Je domovem silně industrializovaného těžkého průmyslu, hlubokého osvojení geotermální technologie a těžby v arktických podmínkách a vlastní dobře propojenou železniční síť. Industrializace byla silnou stránkou Kolvathu, který dokázal čerpat nezměrné přírodní zdroje nacházející se na severu planety pod ledovým krytem."},{"t":"Krant","c":"Geography","b":"Jeden ze dvou zemských koridorů na Vesperu který propojuje [Cassus] a [Bruma] megakontinenty na [Vesper|Vesperu]. Se šířkou 483km, Krant je bohatý na černozem, byl tedy ideálním kandidátem na to se stát obilnicí v dobách prosperity pro oba státy. Sloužil i jako hlavní logistický koridor pro směnný obchod mezi [Kolvath|Kolvathem] a [Occasia|Occasií]. Předválečná populace regionu pro obě velmoce činila zhruba 300 milionů obyvatel. Po vypuknutí [Poslední válka|války] v roce 2347 se Krant ocitl v středobodu prvních bitev. V roce 2372 byla podepsána [Agarpolis Dohoda] která zmrazila dosavadní linii kontaktu (pouze) v Krantu v napjatém příměří na 5 let. V rámci dohody byla ustanovena tzv. \"[Šedá Zóna]\" dělící oba státy v tomto regionu."},{"t":"MZK","c":"Misc","b":"Ministerstvo Zpravodajství Kolvath (zkráceně MZK) je zpravodajským orgánem Kolvathu. Je přímým rivalem [BSO] a jelikož vzniklo později než [BSO], přebralo své operační techniky přímo od nich."},{"t":"BSO","c":"Misc","b":"Bezpečnostní Služba Occasie (zkráceně BSO) je hlavní zpravodajská paže Occasie. Založena za dob první republiky má za sebou dlouhou historii vlivu na technologický vývoj a informační přehled na jižním kontinentu Occasie. Její schopnosti jsou přímým rivalem [MZK]."},{"t":"Zhouba","c":"History","b":"Prvně spatřena v roce 2301 na jižní části Occasie, Zhouba jako taková postihla prvně obiloviny a v dalších dekádách se postupně začala mutovat a šířit na ostatní plodiny. Původem neznámá, první teorie o jejím vývoji a šíření padly na [Kolvath], [BSO] ovšem tato tvrzení zpochybnila, nic nenasvědčovalo nekalému jednání ze strany Kolvathu. Na společném dekádovém summitu v roce 2310 [Kolvath] otevřel diskusi o ekologických katastrofách, jelikož evidentně Zhouba postihla i [Kolvath] v prvních letech nového století.\nSpolupráce v rámci průzkumu Zhouby a jejím zpětném inženýrství vyústila v [Projekt Arcturus]. První labolatoř [Stanice Kolvasia] byla dostavena v roce 2320 a do roku 2347 byla jedním z opěrných bodů projektu. Další důležitou stanicí v rámci projektu byla [Stanice Kestrel] a ... [KLASIFIKOVÁNO]"},{"t":"BSO Operátor - \"Mlha\"","c":"npc","b":""},{"t":"BSO Operátor - \"Šaman\"","c":"npc","b":""},{"t":"BSO Operátor - \"Kámen\"","c":"npc","b":""},{"t":"Johnny Lip","c":"npc","b":"Řidič transportu s notnou dávkou umu pro vyvolávání mořské nemoci ve svých pasažérech, a notnou dávkou vytáčení zatáček za cenu vytáčení místních mechaniků za opotřebované převodovky a spoustu (pro)milí za sebou."},{"t":"Kpt. Illia Hardwood","c":"npc","b":"Kapitánka a velitelka předsunuté základny [1512|Voyager]. Ošlehaná válkou a zkušena bojem na frontové linii, jako kariéristka zvolila po dlouhé době příjemnější práci v kanceláři u logistiky a velení než-li s puškou v ruce. Neznamená to ale, že ji um boje opustil."},{"t":"Praporčík Vadek","c":"npc","b":"Mladý a zkušený operátor rádií s dlouhým dosahem, přiřazen severním velitelstvím Ocassie k asistenci na základně Voyager."}],"sites":[{"t":"Základna Železný Kříž","x":"1202","m":"red","b":"Hlavní logistický uzel a vojenská letecká základna a pevnost Kolvathu v Krant regionu. Silně opevněná, vyzbrojená protiletadlovou ochranou a klíčovým bodem obrany.","k":false},{"t":"Klimastanice Occavath I","x":"1308","m":"cache","b":"Podpůrná klimatická stanice vybudovaná společně s výzkumnou stanicí Kolvasia. Jelikož výzkum Projektu Arcturus vyžadoval značné logistické úsilí, obě stanice byly primárně zásobovány základnou Železný Kříž. ","k":false},{"t":"Stanice Kolvasia","x":"1408","m":"lab","b":"První výzkumná stanice [Projekt Arcturus|Projektu Arcturus] vybudovaná v roce 2320 a uvedena do provozu o rok později vznikla jako společné úsilí obou národních států. Stanice byla tedy pokřtěna spojením obou jejich jmen - [Kolvath|Kolvathu] a [Occasia]. Po vypuknutí války v roce 2347 byla značná část stanice zničena sabotáží obou týmů ve snaze znemožnit druhé straně možnost evakuace důležitých dokumentů. Dle informací z průzkumných letů vypadá stanice opuštěně.","k":false},{"t":"Stanice Litania","x":"0509","m":"lab","b":"Výzkumná stanice Litania zřízena na stejnojmenném ostrově na západním břehu Krantu je jednou ze stanic spadající pod [Projekt Arcturus]. Primárně pod Kolvathskou kontrolou a dohledem, v rámci spolupráce zde operoval i Occasijský personál v menším počtu. Stanice prováděla výzkum křížení morškých řas, oceánu a možnosti alternativních zdrojů potravy. Sabotážní týmy BSO se pokusily zaplavit stanici kontrolovaným výbuchem v sekci C po vypuknutí války, zda-li uspěli není známo. Poslední snímky stanice vykazují neznámou aktivitu, zda-li nepřátelskou, není známo.","k":false},{"t":"Stanice Kestrel","x":"2710","m":"lab","b":"Výzkumná stanice Kestrel, zatracena na začátku \"Poslední války\". Vedla výzkum Projektu Arcturus.","k":false},{"t":"Kemp Liptus","x":"1711","m":"enclave","b":"","k":false},{"t":"Předsunutá Základa Voyager","x":"1512","m":"fob","b":"Váš nový domov po době této mise. Zařízen vším co Occasie může nabídnout.","k":true},{"t":"","x":"1314","m":null,"b":"Pozůstatky zásobovacího konvoje (1x Humvee)","k":false},{"t":"Rangon City","x":"1016"," "sea-dark-1_ogg","name":"sea-dark-1","f":"sea-dark-1.ogg"},{"id":"sea-dark-2_ogg","name":"sea-dark-2","f":"sea-dark-2.ogg"},{"id":"sea-dark-3_ogg","name":"sea-dark-3","f":"sea-dark-3.ogg"},{"id":"sea-dark-4_ogg","name":"sea-dark-4","f":"sea-dark-4.ogg"},{"id":"sea-drip-1_ogg","name":"sea-drip-1","f":"sea-drip-1.ogg"},{"id":"sea-drip-2_ogg","name":"sea-drip-2","f":"sea-drip-2.ogg"},{"id":"sea-earth-crack_ogg","name":"sea-earth-crack","f":"sea-earth-crack.ogg"},{"id":"sea-water-1_ogg","name":"sea-water-1","f":"sea-water-1.ogg"},{"id":"sea-water-2_ogg","name":"sea-water-2","f":"sea-water-2.ogg"},{"id":"sea-whale-1_ogg","name":"sea-whale-1","f":"sea-whale-1.ogg"},{"id":"sea-whale-2_ogg","name":"sea-whale-2","f":"sea-whale-2.ogg"},{"id":"wind-1_ogg","name":"wind-1","f":"wind-1.ogg"},{"id":"wind-2_ogg","name":"wind-2","f":"wind-2.ogg"},{"id":"wind-3_ogg","name":"wind-3","f":"wind-3.ogg"},{"id":"wind-4_ogg","name":"wind-4","f":"wind-4.ogg"}],"cheat":[{"t":"Skill checks","r":["2d6 + skill level + attribute modifier, meet or beat the difficulty.","Easy 6 &middot; ordinary 8 &middot; hard 10 &middot; very hard 12+.","No skill at all, not even level-0: -1, and only if an untrained person could attempt it at all.","Good or bad tools and circumstances: up to +/-2.","Helpers roll the same difficulty. If any of them succeeds, the leader gets +1.","Level-0 is competent. Level-1 is good. Nobody at this table is above level-1.","Notice, 2d6 +: Madeline +3 (Notice-1, Wis +2) · Saraphina +2 (Notice-0, Wis +2) · Angel +1 (untrained -1, Wis +2) · Tork +1 (untrained -1, Wis +2) · Sonya −1 (untrained -1, Wis +0).","Sneak, 2d6 +: Saraphina +2 (Sneak-1, Dex +1, Spark) · Angel +1 (untrained -1, Dex +3, heavy armour -1) · Sonya +1 (Sneak-1, Dex +0) · Madeline +0 (Sneak-0, Dex +1, heavy armour -1) · Tork +0 (untrained -1, Dex +1)."]},{"t":"Saving throws","r":["Roll 1d20, meet or beat the number on the sheet.","Physical for poison, disease, exhaustion and bodily stress.","Evasion for anything you could duck, dodge or dive away from.","Mental for fear, coercion and psychological strain.","Luck for whatever nothing else covers.","NPCs have one save for everything: 15 minus half their hit dice, rounded down.","Saves, Physical / Evasion / Mental / Luck: Angel 12/10/11/13 · Madeline 13/12/11/13 · Saraphina 12/12/11/13 · Tork 12/12/11/13 · Sonya 13/13/12/13."]},{"t":"The combat round","r":["A round is six seconds.","This table rolls initiative per combatant: 1d8 plus Dex modifier, descending order. Ties go to the PCs.","On your turn: one Main Action, one Move of 10 metres, and as many On Turn or Instant actions as is reasonable.","Main Action is an attack or anything that eats most of six seconds.","Instant actions can interrupt, even after dice have been rolled.","Initiative: Angel 1d8+3 · Madeline 1d8+1 · Saraphina 1d8+1 · Tork 1d8+1 · Sonya 1d8+0. Madeline cannot be surprised."]},{"t":"Moves — what you can do on your turn","r":["One Main Action, one Move, and as many On Turn and Instant actions as is reasonable.","You may spend your Main Action as a second Move instead.","\u003cb>Melee attack\u003c/b> (Main) — fist or readied weapon. Unarmed adds Punch skill to damage, not to Shock.","\u003cb>Ranged attack\u003c/b> (Main) — no rifles with an armed melee enemy in reach; a one-handed gun works at -4.","\u003cb>Snap attack\u003c/b> (Instant) — spend your impending Main Action early at -4 to hit. Named characters only.","\u003cb>Charge\u003c/b> (Move + Main) — up to double Move in a straight line, at least 3 metres, +2 to hit, -2 AC until your next turn.","\u003cb>Swarm attack\u003c/b> (Main) — up to four attackers commit, then one of them strikes at +2 to hit and +1 damage per other surviving attacker, to a maximum of +6/+3. Shock from it always lands.","\u003cb>Total Defence\u003c/b> (Instant, costs your Main) — +2 AC until your next turn and immune to Shock this round.","\u003cb>Fighting withdrawal\u003c/b> (Main) — disengage, so you can Move away without giving free attacks.","\u003cb>Run\u003c/b> (Move) — your full move. Do it while engaged without withdrawing first and every melee enemy gets a free swing.","\u003cb>Screen an ally\u003c/b> (Move) — move to within 3 metres and body-block. Attackers must win an opposed Str or Dex check or hit you instead. You can screen as many attackers as your best combat skill level. Not against gunfire.","\u003cb>Use a skill\u003c/b> (Main) — anything doable in six seconds: stabilise someone, start an engine, shout a rally.","\u003cb>Reload\u003c/b> (Main) — pistol or rifle from a readied magazine.","\u003cb>Ready or stow an item\u003c/b> (Main). \u003cb>Pick up an item\u003c/b> (Move). \u003cb>Drop an item\u003c/b> (Instant).","\u003cb>Stand up\u003c/b> (Move). \u003cb>Go prone\u003c/b> (On Turn) — distant shooters take -2, adjacent enemies get +2, your move is halved.","\u003cb>Hold an action\u003c/b> (Move) — keep the rest of your turn in reserve and spend it later as an Instant. A held action resolves before the thing it answers."]},{"t":"Hitting and hurting","r":["1d20 + attack bonus + weapon skill + attribute modifier, against the target's AC.","Natural 1 always misses. Natural 20 always hits.","Damage is the weapon die plus the attribute modifier.","Burst fire: spend three rounds of ammunition for +2 to hit and +2 damage. Needs at least three loaded.","Shock: a missed melee attack still does its Shock damage if the target's AC is at or under the listed number. A hit never does less than Shock would have.","A shield stops the first Shock each round. Total Defence stops all of it that round.","\u003cb>Trauma.\u003c/b> Roll the weapon's Trauma Die alongside the attack roll. If it meets or beats the target's Trauma Target, multiply the whole damage roll by the weapon's Trauma Rating.","An ordinary creature's Trauma Target is 6. Armour and some Edges raise it.","Combat rifle 1d8 &times;3 &middot; light pistol 1d8 &times;2 &middot; heavy pistol 1d6 &times;3 &middot; knife 1d6 &times;3. Roll both dice together and save yourself a step.","No weapon skill at all, not even level-0: -2 to hit (book p.33). Firing untrained right now: Madeline +0 with the combat rifle and Tork +0 with the combat rifle.","Trauma Targets: Angel 8 · Madeline 8 · Saraphina 7 · Tork 7 · Sonya 7. A d6 trauma die (heavy pistol, SMG, knife, club) can never reach 7, so those weapons cannot land a traumatic hit on anyone in this party. Rifles, shotguns, light pistols, axes, spears, grenades and bears can.","To hit: Angel +5 combat rifle (1d12+4) · Madeline +0 combat rifle (1d12+1) · Saraphina +2 light pistol (1d6+1) · Tork +0 combat rifle (1d12+1) · Sonya +4 combat rifle (1d12)."]},{"t":"Down and dying","r":["At zero hit points a character is Mortally Wounded and dies six rounds later.","Minor NPCs and anything hit by something unsurvivable just die.","Stabilising: Dex or Int with Heal, difficulty 8 plus the number of full rounds since they dropped.","Stabilised characters wake in ten minutes on 1 HP and are Frail until a week of rest or real medicine.","First aid after a fight heals 1d6 plus the healer's Heal skill. Repeatable, but each use adds 1 System Strain.","\u003cb>Major injury.\u003c/b> With Traumatic Hits in play, a PC risks one if they drop to zero in the same fight in which they took a traumatic hit, even if that was not the blow that felled them.","Physical save as soon as they drop. Success means they are Mortally Wounded as usual and nothing worse. Failure means a roll on the table.","d12: 1 dead outright &middot; 2 internal damage, dead in an hour without difficulty-10 surgery and a dose of drugs &middot; 3 coma, Physical save at -4 in 1d6 days or die, success costs 1d4 attribute points &middot; 4 blinded 1d6 days, then a Physical save at -4 for whether it returns &middot; 5 gut wound, out for 1d6 days then a Physical save or a permanent -1 Constitution modifier &middot; 6-7 a leg ruined &middot; 8-9 an arm ruined &middot; 10 1d4 permanent System Strain, dead in 1d4 days if it puts them over &middot; 11-12 just a flesh wound.","Stabilising stops the bleeding. It does not stop the consequence.","Below 1 counts as 1 and above 12 counts as 12, so bonuses and penalties to the roll are worth applying.","Without a medkit, stabilising is 2 harder. Angel carries the party's only one.","Stabilise, 2d6 +: Angel +4 (Heal-1, Dex +3) · Tork +1 (Heal-0, Dex +1) · Madeline +0 (no Heal -1, Dex +1) · Saraphina +0 (no Heal -1, Dex +1) · Sonya −1 (no Heal -1, Dex +0). Difficulty 8 + full rounds since they dropped, +2 with no medkit."]},{"t":"System Strain","r":["Maximum equals Constitution score.","At maximum, no further healing or drug can help them at all.","A good night's rest removes one point and restores level in hit points.","This is the brake on stacking first aid. Three quick patch-ups in one afternoon will cost them.","In the encounter panel the party carry an amber strain box next to their hit points. Enemies have none: the book gives NPCs no Constitution to measure it against.","Stress is never gained during a fight. It lands at the end of the scene, so there is nothing to track here mid-combat.","System Strain maximum (Constitution): Angel 15 · Madeline 8 · Saraphina 14 · Tork 15 · Sonya 9."]},{"t":"Morale","r":["Every NPC has a Morale score from 2 to 12. Roll 2d6 against it; equal or higher and they break (p.205).","Check when the first of them goes down, when half are down, and after any shocking reverse.","PCs never check Morale.","Breaking means getting out, not dying in place. Trained troops withdraw covering each other; thugs drop everything and run.","Nobody in this setting fights to the last man over someone else's cargo.","The book disagrees with itself on a tie: the summary on p.37 and the example on p.47 say only a higher roll breaks them; the rule itself on p.205 says equal or higher. This table and the odds use p.205."]},{"t":"Reaction rolls","r":["2d6 plus the Charisma modifier of whoever is doing the talking.","2 or less: as hostile as is plausible. 3-5: hostile. 6-8: neutral, wary.","9-11: unusually cooperative. 12+: as helpful as is plausible.","Roll it instead of deciding. It will surprise you, and that is the point.","Reaction by who does the talking: Saraphina +1 (Unnumbered Friends) · Sonya +1 (Beacon of Hope) · Angel +0 · Tork +0 · Madeline −1."]},{"t":"Stress","r":["Gained at the end of a scene, never during it.","Killing someone: 2. First kill ever: another 1d6. More than one in the scene: +1.","They were not threatening your life: +2. They were helpless: +2.","Witnessing a massacre site or atrocity: 1. A friend goes down: 1, and 2 more if they die.","Maximum is Wisdom. Over it, Mental save at -2, then -4, then -6, or Breakdown.","Losing it: a safe day (-1), a heavy night with 1 System Strain (-1), or an hour talking to a friend who rolls Cha or Wis with Heal or Lead against 9 (-1 for you on a success, +1 for them on a failure).","Hardening instead of a Breakdown: Stress to zero, ignore 1 point per scene forever, take a psychic scar.","Stress maximum (Wisdom): Angel 18 · Madeline 14 · Saraphina 18 · Tork 18 · Sonya 9. Watch Sonya."]},{"t":"Travel and encounters","r":["One hex is five kilometres. Plains 1 walking hour, light forest or suburbs 2, heavy forest hills or intact urban 3, swamp or destroyed urban 4, mountains 8.","Following a major road halves it, minimum one hour, and makes the party Exposed.","Ten hours of travel a day. A forced march buys four more and costs that night's recovery.","Encounter check 1d8 once per travel day, once each night, once per day in camp. A 1 means something.","Exposed: -1 on that die, and they automatically lose the spotting contest.","Hostile country rolls 1d6 instead, teeming country 1d4. A cold camp with no fire rolls 1d10.","Both sides roll Wis with Notice. The higher roll sees the other first and chooses what happens next.","Madeline's Pathfinder means this party cannot Go Astray.","Travel encounters start at sight range: h function cubeToOff(cu){return {col:cu.x+((cu.z-(cu.z&1))/2),row:cu.z};}
function cubeRound(x,y,z){
  var rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  var dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;
  return {x:rx,y:ry,z:rz};
}
function hexLine(a,b){
  var A=offToCube(a.col,a.row),B=offToCube(b.col,b.row),out=[],i;
  var N=Math.max(Math.abs(A.x-B.x),Math.abs(A.y-B.y),Math.abs(A.z-B.z));
  if(N===0)return out;
  for(i=1;i<=N;i++){
    var t=i/N;
    out.push(cubeToOff(cubeRound(
      A.x+(B.x-A.x)*t+1e-6,A.y+(B.y-A.y)*t+1e-6,A.z+(B.z-A.z)*t-2e-6)));
  }

    function(m,target,label){

/* Attachments are a renamed file in audio/ or image/ beside index.html. The
   name is all that ever travels, and it is checked character by character
   before it goes near an attribute. */
function mediaOk(s){
  if(typeof s!=="string"||s.length>80||s.indexOf("..")>=0)return false;
  if(s.indexOf("audio/")!==0&&s.indexOf("image/")!==0)return false;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(!((c>=48&&c<=57)||(c>=65&&c<=90)||(c>=97&&c<=122)||c===46||c===95||c===45||c===47))return false;
  }
  return true;
}

// ---------- taken away: the record goes bad a block at a time, as a failing memory would, then there is nothing left to show ----------

  f2.drawImage(F,0,0);

    const X=16*(rnd(i,31)*30|0),Y=8*(rnd(i,32)*45|0),w=16*(1+(rnd(i,33)*rnd(i,34)*10|0)),h=8*(1+(rnd(i,35)*4|0)),a=rnd(q,40+i)*5|0,v=rnd(q,300+i);
    if(a==0)f.drawImage(F2,v*(FW-w),8*(rnd(q,700+i)*45|0),w,h,X,Y,w,h);                                                                  // read from the wrong address
    else if(a==1){f.globalCompositeOperation="difference";f.fillStyle="#fff";f.fillRect(X,Y,w,h);f.globalCompositeOperation="source-over"} // every bit flipped
    else if(a==2)f.drawImage(F2,X,Y,2,h,X,Y,w,h);                                                                                        // one value, repeated along the line
    else if(a==3){f.fillStyle=gy(v<.6?6:236);f.fillRect(X,Y,w,h)}                                                                        // all zeros, or all ones
    else{f.fillStyle=gy(6);f.fillRect(X,Y,w,h);f.fillStyle=gy(222);for(let b=0;b<w;b+=4)if(rnd(q,500+i*40+b)<.5)f.fillRect(X+b,Y,2,h)}  // raw bits

const cutAt=t=>{let c=0;CUTS.forEach(q=>{c=Math.max(c,1-Math.abs(t-q)/.2)});return c};
const dying=t=>sm(T.lost-2,T.lost+.6,t)*(1-sm(T.lost+1.1,T.lost+1.5,t));

    const dy=roll*FH*.7|0;

  f.fillStyle=gy(255,.6);for(let k=0;k<5;k++)f.fillRect(rnd(fi,40+k)*FW,FH-9+rnd(fi,45+k)*9,10+60*rnd(fi,50+k),1);

  const hb=FH+60-(t*37)%(FH+180); // mains hum bar
  f.fillStyle=stops(f.createLinearGradient(0,hb,0,hb+120),[[0,gy(0,0)],[.5,gy(0,.13)],[1,gy(0,0)]]);f.fillRect(0,hb,FW,120);

  const grain=tv<T.base?snow(tv,fi):tv<T.wood1?base(tv-T.base,fi):tv<T.wood2?wood1(tv-T.wood1,fi):tv<T.city?wood2(tv-T.wood2,fi):
    tv<T.fob?city(tv-T.city,fi):tv<T.rocket?fob(tv-T.fob,fi):tv<T.lost+1.2?rocket(tv-T.rocket,fi):over(fi);

let AU=null;

  if(w>=0)return vol(Math.min(w,.89))*(1-sm(IN-.5,IN,w));
  if(AU&&x>0){ // taken away: static coming up as the record goes bad, then the switch
    const n=AU.c.currentTime;

    AU.st.setTargetAtTime(x<ROT-.5?.05+.3*x/ROT*(.5+.5*rnd(x*12|0,9)):.5*thump(x-ROT),n,.012);
    AU.bp.setTargetAtTime(0,n,.003);

/* The player's bar: which clip, how far into it, playing or not. */

/* Stop the pictures and the sound; whatever is on the canvas stays. */
function dfQuiet(){

function dfFrame(){

function dfOpen(){

  o.rev.hidden=true;o.ov.classList.remove("rev");

/* The first run is over on this screen. Rather than jump to the player, the set comes

function dfHand(){

function dfIn(){var o=DF;return !!o&&!o.ov.hidden&&!o.rev.hidden;}

function dfSeek(pos){

const GAMES={};

// NÁLET: rows of raiders come down on an anti-air gun behind four sandbag walls.
GAMES.nalet={n:"NÁLET",like:"SPACE INVADERS",make:function(r){

    [["...###...","..#####..","#########","#.#####.#","#..#.#..#","...#.#...","..#...#.."],["...###...","..#####..",".#######.","#########","#..#.#..#","..#...#..",".#.....#."]],

  function wav(){
    inv=[];for(let j=0;j<5;j++)for(let i=0;i<8;i++)inv.push({x:28+i*24,y:28+Math.min(wave,5)*8+j*15,j:j});
    dir=1;mt=0;bombs=[];shot=null;bun=[];
    for(let b=0;b<4;b++){const c=[];for(let y=0;y<7;y++)for(let x=0;x<12;x++)if(!((y===0&&(x<2||x>9))||(y===1&&(x<1||x>10))||(y>4&&x>3&&x<8)))c.push({x:x,y:y});

      if(b.c.some(c=>Math.abs(c.x+.5-cx)<1&&Math.abs(c.y+.5-cy)<1)){b.c=b.c.filter(c=>Math.hypot(c.x+.5-cx,c.y+.5-cy)>k+r()*.8);return true;}}

// TROSKY: a ship in a drifting field of wreckage; every piece hit breaks in two.
GAMES.trosky={n:"TROSKY",like:"ASTEROIDS",make:function(r){
  const s={score:0,over:false},pa=[],home=()=>({x:160,y:126,vx:0,vy:0,a:-Math.PI/2,inv:150});
  let lives=3,wave=0,sh=home(),bl=[],rk=[],eb=[],dead=0,next=40,jump=0,pr=null,prT=1100,th=0;
  function rock(x,y,z){const n=9+(r()*3|0),p=[];for(let i=0;i<n;i++)p.push(.72+r()*.42);
    const a=r()*6.283,v=(.25+r()*.5)*(4-z)*.55;return {x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:z,R:[0,5,9,16][z],p:p,a:r()*6.283,w:(r()-.5)*.04};}
  const wrap=o=>{o.x=(o.x+W)%W;o.y=(o.y+H)%H;};
  function kill(){burst(pa,sh.x,sh.y,26,2.2,C.w);SFX.die();lives--;dead=100;}
  s.step=function(I){
    pstep(pa);
    for(const k of rk){k.x+=k.vx;k.y+=k.vy;k.a+=k.w;wrap(k);}
    for(let i=bl.length;i--;){const b=bl[i];b.x+=b.vx;b.y+=b.vy;wrap(b);if(--b.l<=0)bl.splice(i,1);}
    if(!rk.length&&--next<=0){wave++;next=90;
      for(let i=0;i<Math.min(3+wave,9);i++){let x,y;do{x=r()*W;y=r()*H;}while(Math.hypot(x-sh.x,y-sh.y)<70);rk.push(rock(x,y,3));}}
    if(dead){if(--dead<=0){if(lives<=0){s.over=true;return;}sh=home();}}
    else{
      sh.a+=I.x*.075;
      if(I.y<0){sh.vx+=Math.cos(sh.a)*.055;sh.vy+=Math.sin(sh.a)*.055;if(th++%7===0)nz(.09,.03,500,200);}else th=0;
      const v=Math.hypot(sh.vx,sh.vy);if(v>3.2){sh.vx*=3.2/v;sh.vy*=3.2/v;}
      sh.vx*=.995;sh.vy*=.995;sh.x+=sh.vx;sh.y+=sh.vy;wrap(sh);if(sh.inv)sh.inv--;
      if(I.pa&&bl.length<4){bl.push({x:sh.x+Math.cos(sh.a)*6,y:sh.y+Math.sin(sh.a)*6,vx:Math.cos(sh.a)*4.5+sh.vx,vy:Math.sin(sh.a)*4.5+sh.vy,l:52});SFX.shot();}
      if(jump)jump--;
      if(I.pb&&!jump){sh.x=20+r()*(W-40);sh.y=20+r()*(H-40);sh.vx=sh.vy=0;sh.inv=40;jump=150;SFX.pow();}   // B: a blind jump somewhere else
    }
    for(let i=rk.length;i--;){const k=rk[i];let hit=false;
      for(let j=bl.length;j--;)if(Math.hypot(bl[j].x-k.x,bl[j].y-k.y)<k.R+1){bl.splice(j,1);hit=true;break;}
      if(hit){s.score+=[0,100,50,20][k.z];burst(pa,k.x,k.y,6+k.z*3,1.3,C.b);rk.splice(i,1);
        if(k.z>1){rk.push(rock(k.x,k.y,k.z-1));rk.push(rock(k.x,k.y,k.z-1));}SFX.boom();continue;}
      if(!dead&&!sh.inv&&Math.hypot(sh.x-k.x,sh.y-k.y)<k.R+3)kill();}
    if(pr){pr.x+=pr.d;pr.y+=Math.sin(pr.x*.05)*.5;                    // a probe that shoots back
      if(pr.x<-10||pr.x>W+10)pr=null;
      else{if(--pr.c<=0&&!dead){pr.c=85;const a=Math.atan2(sh.y-pr.y,sh.x-pr.x)+(r()-.5)*.5;eb.push({x:pr.x,y:pr.y,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,l:110});tone(1200,600,.08,.03);}
        for(let j=bl.length;j--;)if(Math.hypot(bl[j].x-pr.x,bl[j].y-pr.y)<7){bl.splice(j,1);s.score+=200;burst(pa,pr.x,pr.y,14,1.6,C.r);SFX.boom();pr=null;break;}
        if(pr&&!dead&&!sh.inv&&Math.hypot(sh.x-pr.x,sh.y-pr.y)<9)kill();}}
    else if(--prT<=0){const d=r()<.5?1:-1;pr={x:d>0?-8:W+8,y:30+r()*(H-60),d:d*.9,c:60};prT=900+r()*700|0;}
    for(let i=eb.length;i--;){const b=eb[i];b.x+=b.vx;b.y+=b.vy;
      if(--b.l<=0||b.x<0||b.x>W||b.y<0||b.y>H){eb.splice(i,1);continue;}

    if(!dead&&!(sh.inv&&sh.inv>>2&1)){const pt=(a,d)=>[sh.x+Math.cos(sh.a+a)*d,sh.y+Math.sin(sh.a+a)*d],A=pt(0,7),B=pt(2.5,6),D=pt(Math.PI,2.5),F=pt(-2.5,6);
      g.strokeStyle=C.w;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.lineTo(D[0],D[1]);g.lineTo(F[0],F[1]);g.closePath();g.stroke();

}};

// KOPULE: rockets come down on six settlements; three batteries answer. A tap on the glass fires there.

// TUNELY: a courier in the service tunnels, four patrol drones after it. Every floor is dug afresh.
GAMES.tunely={n:"TUNELY",like:"PAC-MAN",make:function(r){

    HC=[C.r,C.o,C.g,C.p],CORN=[[1,1],[TW-2,1],[TW-2,TH-2],[1,TH-2]];

  const open=(x,y)=>x>=0&&y>=0&&x<TW&&y<TH&&m[y][x]!==1;

  function bfs(sx,sy){const d=new Int16Array(TW*TH).fill(-1),qu=[sx+sy*TW];d[qu[0]]=0;
    for(let i=0;i<qu.length;i++){const c=qu[i],x=c%TW,y=c/TW|0;for(const e of D){const k=x+e[0]+(y+e[1])*TW;if(open(x+e[0],y+e[1])&&d[k]<0){d[k]=d[c]+1;qu.push(k);}}}
    return d;}
  function adv(e,sp,pick){

  }
  function ppick(e){if((e.wx||e.wy)&&open(e.x+e.wx,e.y+e.wy)){e.dx=e.wx;e.dy=e.wy;}else if(!open(e.x+e.dx,e.y+e.dy))e.dx=e.dy=0;}

        D.forEach(d=>{if(open(i+d[0],j+d[1]))x.fillRect(i*T+(d[0]>0?T-1:0),j*T+(d[1]>0?T-1:0),d[0]?1:T,d[1]?1:T);});}},TW*T,TH*T);

// ODRAZ: a square court, a paddle a side, two to four players over the table. Five lives each; a side with nobody is a wall.
// Nothing is simulated in common. The ball is a line from a point at a moment (b: x, y, vx, vy, t, n), which every screen
// follows by itself; where it meets a player's side, only that player says what happened and writes the next line.
// So the one defending never feels the lag, and the others see the answer a moment late.
GAMES.odraz={n:"ODRAZ",like:"PONG",live:1,noTap:1,
  seats:n=>n===2?[0,1]:n===3?[0,1,3]:[0,1,3,2],   // left, right, bottom, top
  init:function(seats,t0){const sc={};let k=0;for(const id in seats){sc[seats[id]]=5;k++;}
    return {sc:sc,b:{x:116,y:116,vx:104,vy:38,t:t0,n:1}};},   // never along a diagonal: corner to corner it would come back for ever
  make:function(r,L){
    const s={score:0,over:false,win:""},S=232,X0=44,Y0=4,R=3,PL=44,PD=12,CO=16,COL=[C.g,C.r,C.p,C.y],lo=PL/2+CO,hi=S-PL/2-CO,dp=[];
    let ev=null,sc={},pd={},my=S/2,sent=-1,fc=0,goal=0,goalS=-1,was={};
    const alive=k=>(sc[k]|0)>0&&L.here(k);
    function path(at){ // where the ball is at that moment: w = the seat it is waiting on, tc = since when
      if(!ev)return null;let t=(at-ev.t)/1000;if(t<0)return {x:ev.x,y:ev.y,pre:1,w:-1};
      let x=ev.x,y=ev.y,vx=ev.vx,vy=ev.vy,k=0;if(!vx&&!vy)return {x:x,y:y,w:-1,still:1};
      while(k++<400){
        const lx=alive(0)?PD:R,hx=S-(alive(1)?PD:R),ly=alive(2)?PD:R,hy=S-(alive(3)?PD:R);
        let ax=vx>0?(hx-x)/vx:vx<0?(lx-x)/vx:1e9,ay=vy>0?(hy-y)/vy:vy<0?(ly-y)/vy:1e9;if(ax<0)ax=0;if(ay<0)ay=0;
        const m=Math.min(ax,ay);if(m>=t){x+=vx*t;y+=vy*t;break;}
        x+=vx*m;y+=vy*m;t-=m;
        if(ax<=ay){const e=vx>0?1:0;if(alive(e)&&y>=CO&&y<=S-CO)return {x:x,y:y,w:e,tc:at-t*1000};vx=-vx;}
        else{const e=vy>0?3:2;if(alive(e)&&x>=CO&&x<=S-CO)return {x:x,y:y,w:e,tc:at-t*1000};vy=-vy;}
      }
      return {x:x,y:y,w:-1};
    }
    function serve(at,n){
      const liv=[0,1,2,3].filter(alive);if(liv.length<2)return {x:S/2,y:S/2,vx:0,vy:0,t:at,n:n};
      const e=liv[Math.random()*liv.length|0],along=CO+20+Math.random()*(S-2*CO-40),ex=e<2?(e?S:0):along,ey=e<2?along:(e===3?S:0),d=Math.hypot(ex-S/2,ey-S/2);
      return {x:S/2,y:S/2,vx:(ex-S/2)/d*108,vy:(ey-S/2)/d*108,t:at+1300,n:n};
    }
    s.sync=function(G){
      if(G.b&&(!ev||G.b.n>=ev.n)){if(ev&&G.b.n>ev.n&&(G.b.vx||G.b.vy)&&G.b.t<=L.now())SFX.blip();ev=G.b;}
      sc=G.sc||{};pd=G.pd||{};
      for(let k=0;k<4;k++){if(was[k]>(sc[k]|0)&&k!==L.me){goal=40;goalS=k;SFX.boom();}was[k]=sc[k]|0;}
    };
    s.step=function(I){
      fc++;if(goal)goal--;const at=L.now(),me=L.me;
      if(me>=0&&alive(me)){
        const ax=me<2?I.y:I.x;my+=ax*3.4;
        if(!ax&&I.px>=0&&(I.ph||performance.now()-I.pm<1500))my=me<2?I.py-Y0:I.px-X0;       // a finger or the mouse on the glass moves it too
        my=cl(my,lo,hi);
        if(fc%5===0&&Math.round(my)!==sent){sent=Math.round(my);L.send("pd/"+me,sent);}
      }
      const live=[0,1,2,3].filter(alive);
      if(ev&&at>L.t0+800&&Object.keys(sc).length&&live.length<2){L.send("end",1);s.over=true;s.win=live.length?L.names[live[0]]||"":"";if(live[0]===me)SFX.win();return;}
      const p=path(at);
      if(p&&p.still&&live[0]===me&&at-ev.t>3000){ev=serve(at,ev.n+1);L.send("b",ev);}   // a ball left lying with players still in: the lowest seat serves it again
      if(p&&p.w>=0){
        if(p.w===me){
          const al=me<2?p.y:p.x;
          if(Math.abs(al-my)<=PL/2+R+1){
            // a touch of chance on every bounce: between two paddles left alone the ball would otherwise find a round it never leaves
            const sp=Math.min(300,Math.hypot(ev.vx,ev.vy)*1.06),off=cl((al-my)/(PL/2),-1,1)*.85+(Math.random()-.5)*.14;
            const vx=me===0?1:me===1?-1:off,vy=me===2?1:me===3?-1:off,l=Math.hypot(vx,vy);
            ev={x:p.x,y:p.y,vx:vx/l*sp,vy:vy/l*sp,t:p.tc,n:ev.n+1};L.send("b",ev);SFX.hit();
          }else{sc[me]=(sc[me]|0)-1;was[me]=sc[me];L.send("sc/"+me,sc[me]);goal=40;goalS=me;SFX.die();ev=serve(at,ev.n+1);L.send("b",ev);}
        }else if(at-p.tc>2500&&me>=0&&live.filter(k=>k!==p.w)[0]===me){   // the defender has gone quiet: the lowest seat still in calls them out

      }
      for(let k=0;k<4;k++){const v=k===me?my:pd[k]==null?S/2:pd[k];dp[k]=dp[k]==null?v:dp[k]+(v-dp[k])*.35;}
    };
    s.draw=function(g){
      const p=path(L.now());
      g.fillStyle="#070a1c";g.fillRect(X0,Y0,S,S);
      g.fillStyle=C.d;[[0,0],[S-CO,0],[0,S-CO],[S-CO,S-CO]].forEach(c=>g.fillRect(X0+c[0],Y0+c[1],CO,CO));
      for(let k=0;k<4;k++){const on=alive(k),v=dp[k]==null?S/2:dp[k],hot=goal&&goalS===k&&goal>>2&1;
        g.fillStyle=hot?C.w:on?COL[k]:C.d;
        if(!on||hot){if(k<2)g.fillRect(X0+(k?S-2:0),Y0+CO,2,S-2*CO);else g.fillRect(X0+CO,Y0+(k===3?S-2:0),S-2*CO,2);}
        if(on){g.fillStyle=COL[k];if(k<2)g.fillRect(X0+(k?S-PD+R:PD-R-4),Y0+v-PL/2,4,PL);else g.fillRect(X0+v-PL/2,Y0+(k===3?S-PD+R:PD-R-4),PL,4);}
        if(!(k in L.names))continue;
        const lf=k===0||k===2,x=lf?3:317,y=k===2?14:k===3?196:104,a=lf?0:2;
        tx(g,String(L.names[k]).slice(0,6),x,y,on?COL[k]:C.d,a);tx(g,(sc[k]|0)>0?"♥♥♥♥♥".slice(0,sc[k]):"×",x,y+11,on?COL[k]:C.d,a);if(k===L.me)tx(g,"TY",x,y+22,C.w,a);}
      if(p&&!p.still&&!(p.pre&&fc>>3&1)){g.fillStyle=C.w;g.fillRect(X0+p.x-R,Y0+p.y-R,R*2,R*2);}
    };
    return s;
  }};

// STOPA: two to four lines of light in one yard. Each steers left or right, leaves a trail, and must not touch one.
// Every screen flies its own line and writes where it has been (rd/tr/<seat>/<i>: a point packed into a number, with a mark
// for a stretch that leaves no trail); it alone says when it died. The lowest seat still here keeps the rounds: when one
// line is left it gives the points (one for every line you outlived), starts the next round, and names the winner.
GAMES.stopa={n:"STOPA",like:"ACHTUNG, DIE KURVE",live:1,noTap:1,
  init:function(seats,t0){const sc={};for(const id in seats)sc[seats[id]]=0;return {rd:{n:1,t0:t0,seed:Math.random()*1e9|0,sc:sc}};},
  make:function(r,L){
    const s={score:0,over:false,win:""},COL=[C.g,C.r,C.p,C.y],Y0=13,SP=1.15,N=Object.keys(L.names).length,GOAL=5*(N-1),me=L.me;

  if(b.p[1]<pad&&b.v[1]<0){b.p[1]=pad;b.v[1]=-b.v[1]*DVWALL;bump=true;}
  if(b.p[1]>lo&&b.v[1]>0){b.p[1]=lo;b.v[1]=-b.v[1]*DVWALL;bump=true;}

/* Somebody else's roll arrives with its numbers already decided, so each die

function dvPaint(){

  c.lineJoin="round";

    if(!cst.who)return;

      if(!b.rest)return;

function dAnimate(rec,done){
  var host=document.querySelector("#dTicker .dent");
  var quiet=false;
  try{quiet=matchMedia("(prefers-reduced-motion:reduce)").matches;}catch(e){}
  if(!host||quiet)return done();
  var chips=Array.prototype.slice.call(host.querySelectorAll(".dface"));
  var tot=host.querySelector(".dtot");
  if(!chips.length||!tot)return done();
  host.classList.add("rolling");
  chips.forEach(function(c){c.classList.remove("set");});
  var t0=Date.now(),settle=chips.map(function(c,i){return 330+i*95+Math.random()*70;});
  var last=Math.max.apply(null,settle)+110;
  (function step(){
    var el=Date.now()-t0,sum=rec.m,all=true;
    chips.forEach(function(c,i){
      if(el<settle[i]){
        all=false;
        var v=dRand(rec.s);
        c.textContent=v;sum+=v;
        c.style.transform="translateY("+(Math.sin(el/34+i*2)*2.5).toFixed(2)+"px)";
      }else{
        if(!c.classList.contains("set")){
          c.classList.add("set");c.textContent=rec.f[i];c.style.transform="";
        }
        sum+=rec.f[i];
      }
    });
    tot.textContent=all?rec.t:sum;
    if(el<last)requestAnimationFrame(step);
    else{
      tot.textContent=rec.t;
      host.classList.remove("rolling");host.classList.add("landed");
      setTimeout(function(){host.classList.remove("landed");},480);
      done();
    }
  })();
}

}

/* The GM signs in from the lock in the header, not from the dice gate: one

    gmPanelOpen(true);

function gmRemember(v){

       v?localStorage.setItem("vesper:gmpw",v):localStorage.removeItem("vesper:gmpw");}catch(e){}

function gmSignIn(pw,quiet){

  if(msg&&!quiet)msg.textContent="…";

  return Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js")])
    .then(function(m){
      var app=m[0].getApps&&m[0].getApps().length?m[0].getApps()[0]
             :m[0].initializeApp({apiKey:dGateCfg.key,databaseURL:dGateCfg.url,
                                  authDomain:dGateCfg.domain});
      return m[1].signInWithEmailAndPassword(m[1].getAuth(app),dGateCfg.gm,pw);
    })
    .then(function(){
      dGateWho=dGateCfg.gm;dSignedIn=true;dGateRender();dSyncConnect();
      gmAuth=true;bcGmRender();
      return gmTryUnlock(pw);
    })
    .then(function(ok){
      /* Signed in as the GM, but this export carries no deck: the live
         controls still work, so the tab opens anyway. */
      var open=ok||(gmAuth&&!gmBlob());
      if(msg)msg.textContent=open?"":(gmWhy||T("deckBad"));
      if(open){
        var l=document.getElementById("gmLock");if(l)l.classList.add("on");

    })["catch"](function(err){
      if(msg)msg.textContent=T("signInFail")+" "+String(err&&err.code||"?");
      return false;
    });
}
function gmForget(){

    .then(function(m){return m[1].signOut(m[1].getAuth(m[0].getApps()[0]));}).then(again,again);
