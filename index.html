<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krant Region - Západ</title>
<style>
:root{--void:#07120d;--panel:#0e1e17;--panel2:#14291f;--panel3:#0a1912;
--line:#25453a;--line2:#142a21;--bone:#8fb3a1;--dim:#5c8071;--bright:#cfe8db;
--accent:#4fbf8f;--accent-bg:#16332a;--accent-hi:#8ef0c2;--accent-soft:rgba(79,191,143,.16);
--amber:#c9a44a;--oxide:#c0603a;--trough:#0a1611;--thumb:#2a4d3f;--thumb-hi:#3a6553;
--float:rgba(12,28,21,.95);
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--thumb) var(--trough)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--trough)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid var(--trough)}
::-webkit-scrollbar-thumb:hover{background:var(--thumb-hi)}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--mono);font-size:12px;
line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:baseline;gap:13px;padding:9px 15px;
border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{margin:0;font-size:13px;color:var(--bright);letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.sub{color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.wrap{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0}
.field{position:absolute;inset:0;overflow:auto;padding:16px}
.stack{position:relative;line-height:0;width:max-content}
canvas{display:block;position:absolute;top:0;left:0}
#pix{position:relative;image-rendering:pixelated;image-rendering:crisp-edges}
#lbl{pointer-events:none}
.zoomctl{position:absolute;right:18px;top:18px;z-index:5;display:flex;align-items:stretch;
background:var(--float);border:1px solid var(--line)}
.zoomctl button{background:none;border:0;padding:4px 11px;cursor:pointer;font-size:15px;color:var(--bone)}
.zoomctl button:hover{background:var(--panel2);color:var(--bright)}
.zoomctl button:disabled{opacity:.3;cursor:default}
.zoomctl .zruler{border-right:1px solid var(--line);font-size:14px}
.zoomctl .zruler[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-hi)}
.zoomctl span{padding:0 9px;font-size:10px;color:var(--dim);letter-spacing:.12em;
border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center}
.panel{width:336px;flex:none;background:var(--panel);border-left:1px solid var(--line);
display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex:none;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-right:1px solid var(--line);padding:9px 4px;
cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
text-transform:uppercase}
.tabs button:last-child{border-right:0}
#wikiFind{width:100%;background:var(--void);border:1px solid var(--line);color:var(--bright);
  font:inherit;font-size:12px;padding:6px 8px;margin-bottom:10px}
#wikiFind:focus{outline:none;border-color:var(--accent)}
.wsec{color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  margin:13px 0 5px;border-bottom:1px solid var(--line2);padding-bottom:3px}
.wsec:first-child{margin-top:0}
.wart{border-left:2px solid var(--line);padding:1px 0 1px 9px;margin-bottom:11px}
.wart.site{border-left-color:var(--accent)}
.wart.unknown{border-left-color:var(--amber)}
.wart.unknown h4{color:var(--amber);letter-spacing:.12em}
.wart .wb.muted{color:var(--dim);font-style:italic}
a.wrow{display:block;text-decoration:none;cursor:pointer;margin-bottom:9px}
a.wrow:hover{border-left-color:var(--accent-hi);background:var(--panel2)}
a.wrow h4{color:var(--bright)}
.wex{color:var(--bone);font-size:11.5px;line-height:1.5;margin-top:3px}
.wex.muted{color:var(--dim);font-style:italic}
.wback{display:inline-block;color:var(--accent);text-decoration:none;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:11px}
.wfull h3{margin:0 0 3px;font-size:15px;color:var(--bright)}
.wfull .wx{margin-bottom:9px}
.wfull .wb{font-size:12.5px;line-height:1.62;white-space:pre-wrap;color:var(--bone)}
.wgoto{display:inline-block;margin-top:13px;color:var(--accent);text-decoration:none;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.wikilink{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.wart .wx a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.wart h4{margin:0 0 3px;font-size:12.5px;color:var(--bright);font-weight:700}
.wart .wx{color:var(--dim);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.wart .wb{color:var(--bone);font-size:12px;line-height:1.55;margin-top:4px;white-space:pre-wrap}
.wnone{color:var(--dim);font-size:12px;line-height:1.5}
.measurebox{position:absolute;left:12px;top:12px;z-index:6;width:216px;background:var(--float);
  border:1px solid var(--line);padding:9px 11px 11px;font-size:11.5px;color:var(--bone)}
.measurebox.hidden{display:none}
.mb-h{color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px}
.measurebox .mb-r{display:flex;justify-content:space-between;gap:8px;margin:2px 0}
.measurebox .mb-r b{color:var(--bright);font-weight:600}
.stage{position:relative}
.tabs button:hover{color:var(--bone);background:var(--panel2)}
.tabs button[aria-pressed="true"]{color:var(--bright);background:var(--accent-bg);
box-shadow:inset 0 -2px 0 var(--accent)}
.pane{flex:1;overflow-y:auto;padding:15px;min-height:0}
.measurebox{position:absolute;right:18px;top:62px;z-index:5;width:210px;
background:var(--float);border:1px solid var(--line);padding:9px 11px;line-height:1.55}
.measurebox .mb-h{color:var(--bright);letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;margin-bottom:5px}
.measurebox .mb-r{display:flex;justify-content:space-between;gap:9px;font-size:11px}
.measurebox .mb-r b{color:var(--bright)}
.measurebox .mb-warn{color:var(--oxide);margin-top:5px;font-size:10.5px}
.measurebox .mb-hint{color:var(--dim);margin-top:5px;font-size:9.5px}
.hidden{display:none}
.dir{margin:0 0 20px}
.dir:last-child{margin-bottom:6px}
.dirdate{color:var(--amber);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.dir h3{margin:0 0 7px;font-size:14px;color:var(--bright);font-weight:600;line-height:1.35}
.dirbody{white-space:pre-wrap;line-height:1.65}
.dir audio{width:100%;margin-top:9px;filter:invert(.9) hue-rotate(170deg)}
.dirtag{color:var(--amber);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}
.dirsep{border:0;border-top:1px solid var(--line);margin:0 0 18px}
.hexlink{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
.hexlink:hover{color:var(--accent-hi);background:var(--accent-soft)}
.coord{color:var(--bright);letter-spacing:.22em;font-size:18px}
.meta{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;margin-bottom:11px}
.site{color:var(--bright);font-size:14px;margin-bottom:7px}
.brief{color:var(--bone);white-space:pre-wrap}
.rule{border:0;border-top:1px solid var(--line);margin:13px 0}
.pbtn{background:var(--panel2);border:1px solid var(--line);padding:6px 9px;cursor:pointer;
letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:var(--bone);width:100%;margin-top:9px}
.pbtn:hover{border-color:var(--dim);color:var(--bright)}
.muted{color:var(--dim)}
.lgd{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:10.5px}
.lsec{color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  margin:13px 0 5px;border-bottom:1px solid var(--line2);padding-bottom:3px}
.lsec:first-child{margin-top:0}
.lgrid{display:flex;flex-direction:column;gap:3px}
.lgd i.chip{width:15px;height:12px;flex:none;border:1px solid rgba(0,0,0,.5);display:block}
.lgd i.chip.unk{background:repeating-linear-gradient(-45deg,var(--line) 0 2px,transparent 2px 5px);
  border-color:var(--line)}
.lgd i.gly{width:15px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-style:normal;line-height:1;border:0}
.lgd i.ln{width:15px;height:12px;flex:none;display:flex;align-items:center;border:0}
.lgd i.ln b{display:block;width:100%;height:3px}
.lgd span{min-width:0}
/* identical to the editor masthead: same size, tracking, colour */
.wm{color:var(--bright);letter-spacing:.34em;text-transform:uppercase;font-size:13px}
.wdiv{color:var(--dim);margin:0 9px 0 5px;letter-spacing:0}
#hTitle{color:var(--bright);font-size:13px;letter-spacing:.06em;text-transform:none;font-weight:400}
h1{display:flex;align-items:baseline}
.spacer{flex:1}
/* One group, right-aligned, both rows the same height so they line up
   regardless of the header's baseline alignment. */
.hctl{display:flex;align-items:center;gap:10px;margin-left:12px;align-self:center}
.locsel{display:flex;height:19px;border:1px solid var(--line)}
.locsel button{background:none;border:0;color:var(--dim);font:inherit;font-size:10px;
  letter-spacing:.1em;padding:0 8px;cursor:pointer;line-height:17px}
.locsel button+button{border-left:1px solid var(--line)}
.locsel button[aria-pressed="true"]{background:var(--accent-bg);color:var(--bright)}
.pthemes{display:flex;gap:4px;align-items:center;height:19px}
.pthemes button{width:17px;height:17px;border:1px solid var(--line);cursor:pointer;padding:0;
  display:block}
.pthemes button[aria-pressed="true"]{border-color:var(--bright);box-shadow:0 0 0 1px var(--bright)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
/* ---- dice ---------------------------------------------------------
   A tray in the bottom corner of the map and a strip of recent results
   beside it, so the table can see who threw what without leaving the map. */
.dice{position:absolute;left:14px;right:14px;bottom:14px;z-index:7;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dice>*{pointer-events:auto}
.dicerow{display:flex;align-items:flex-end;gap:10px}
.dicebar{flex:1;min-width:0;display:flex;background:var(--float);border:1px solid var(--line)}
.dexp{flex:none;width:25px;background:none;border:0;border-right:1px solid var(--line);
  color:var(--dim);cursor:pointer;font-size:8px;font-family:var(--mono)}
.dexp:hover{color:var(--bright);background:var(--panel2)}
.dexp[aria-expanded="true"]{color:var(--accent-hi);background:var(--accent-bg)}
.dticker{flex:1;min-width:0;display:flex;align-items:center;gap:17px;
  overflow-x:auto;overflow-y:hidden;padding:7px 11px;scrollbar-width:none}
.dticker::-webkit-scrollbar{height:0}
.dnone{color:var(--dim);font-size:10.5px;letter-spacing:.1em;white-space:nowrap}
.dent{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;font-size:12px}
.dwho{font-style:normal;color:var(--bone);max-width:9em;overflow:hidden;text-overflow:ellipsis}
.dtot{color:var(--bright);font-size:16px;font-weight:700;min-width:1.1em;text-align:center}
.dnota{font-style:normal;color:var(--dim);font-size:10px;letter-spacing:.05em}
.dent.crit .dtot{color:var(--accent-hi)}
.dent.fumble .dtot{color:var(--oxide)}
.dfaces{display:flex;gap:3px}
.dface{font-style:normal;display:flex;align-items:center;justify-content:center;
  min-width:19px;height:19px;padding:0 3px;font-size:11px;color:var(--dim);
  border:1px solid var(--line);background:var(--panel3)}
.dface.set{color:var(--bright);border-color:var(--thumb-hi)}
.dent.rolling .dtot{color:var(--dim)}
.dent.landed .dtot{animation:dpop .42s ease-out}
@keyframes dpop{0%{transform:scale(1.55);color:var(--accent-hi)}100%{transform:none}}
.dtray{flex:none;width:198px;background:var(--float);border:1px solid var(--line);
  padding:7px 8px 8px;display:flex;flex-direction:column;gap:6px}
.dtop{display:flex;gap:6px;align-items:center}
#dName{flex:1;min-width:0;background:var(--void);border:1px solid var(--line);
  color:var(--bright);font:inherit;font-size:11px;padding:4px 6px}
.dswatch{flex:none;width:21px;height:21px;padding:0;cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:0}
.dswatch::-webkit-color-swatch-wrapper{padding:2px}
.dswatch::-webkit-color-swatch{border:0}
.dswatch::-moz-color-swatch{border:0}
#dName:focus{outline:none;border-color:var(--accent)}
.dmin{flex:none;width:21px;height:21px;background:none;border:1px solid var(--line);
  color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:13px;line-height:1;padding:0}
.dmin:hover{color:var(--bright);border-color:var(--dim)}
.dsel{display:flex;align-items:center;gap:4px}
.dsel span{color:var(--dim);font-size:11px;flex:none}
.dsel select{flex:1;min-width:0;background:var(--void);color:var(--bright);
  border:1px solid var(--line);font:inherit;font-size:11px;padding:4px 3px;cursor:pointer;
  -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.dsel select:focus{outline:none;border-color:var(--accent)}
.dsel option{background:var(--panel);color:var(--bright)}
.dgate{display:flex;flex-wrap:wrap;gap:5px}
.dgate.hidden{display:none}
#dPass{flex:1;min-width:0;background:var(--void);border:1px solid var(--line);
  color:var(--bright);font:inherit;font-size:11px;padding:4px 6px}
#dPassGo{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--bone);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 8px;cursor:pointer}
#dPassGo:hover{color:var(--bright);border-color:var(--dim)}
.dgatemsg{flex:0 0 100%;font-size:10px;color:var(--oxide);min-height:12px}
.droll.locked{background:none;color:var(--dim);border-color:var(--line)}
.droll{background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent-hi);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  padding:8px 4px;cursor:pointer}
.droll:hover{background:var(--accent);color:var(--void)}
.droll:disabled{opacity:.45;cursor:default}
.dshow{display:none;align-self:flex-end;background:var(--float);border:1px solid var(--line);
  color:var(--bone);font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 12px;cursor:pointer}
.dshow:hover{color:var(--bright);border-color:var(--dim)}
.dice.min .dicerow,.dice.min .dlog{display:none}
.dice.min .dshow{display:block}
.dlog{background:var(--panel);border:1px solid var(--line);max-height:238px;overflow-y:auto}
.dlog .drow{display:flex;align-items:center;gap:9px;padding:5px 11px;font-size:11.5px}
.dlog .drow+.drow{border-top:1px solid var(--line2)}
.dlog .dtime{font-style:normal;color:var(--dim);font-size:9.5px;flex:none;width:44px}
.dlog .dwho{flex:1;min-width:0;max-width:none}
.dlog .dfl{font-style:normal;color:var(--dim);font-size:10px;flex:none}
.dlog .dtot{font-size:14px;min-width:3ch;text-align:right}
.dlog .dnota{min-width:7ch;text-align:right}
.dlog .drow.crit .dtot{color:var(--accent-hi)}
.dlog .drow.fumble .dtot{color:var(--oxide)}
.dlogfoot{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;
  border-top:1px solid var(--line)}
.dclear{background:none;border:0;color:var(--dim);font:inherit;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.dclear:hover{color:var(--oxide)}
.dboard{color:var(--dim)}
.dboard.on{color:var(--accent)}
.dboard:hover{color:var(--bright)}
/* the throw itself: a canvas laid over the map, only painted mid-throw */
.dvcan{position:absolute;inset:0;z-index:6;pointer-events:none;display:none}
.dvcan.on{display:block}
/* ---- narrow screens ------------------------------------------------
   The panel becomes a sheet docked to the bottom: its tabs stay put and
   the body slides up over the map, so the map keeps the whole screen
   until you actually ask for a briefing. */
.sheetgrip{display:none;align-items:center;justify-content:center;height:21px;flex:none;
  background:var(--panel);border:0;border-bottom:1px solid var(--line2);cursor:pointer;padding:0}
.sheetgrip i{display:block;width:34px;height:3px;background:var(--thumb-hi)}
@media (max-width:860px){
  header{padding:7px 11px;gap:10px}
  h1,.wm,#hTitle{font-size:12px}
  .wm{letter-spacing:.24em}
  .hctl{margin-left:0}
  .wrap{flex-direction:column}
  .stage{flex:1;min-height:0}
  .field{padding:0;touch-action:pan-x pan-y}
  .zoomctl{right:10px;top:10px}
  .zoomctl button{padding:9px 14px;font-size:17px}
  .measurebox{right:10px;top:58px;width:192px}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:40;
    border-left:0;border-top:1px solid var(--line);box-shadow:0 -16px 34px rgba(0,0,0,.5)}
  .sheetgrip{display:flex}
  .tabs button{padding:12px 3px;font-size:9px}
  .pane{flex:none;max-height:0;padding:0 13px;overflow:hidden;
    transition:max-height .2s ease,padding .2s ease}
  body.sheet .pane{max-height:54vh;max-height:54dvh;padding:13px;overflow-y:auto}
  .dice{position:fixed;left:0;right:0;bottom:var(--dockh,60px);gap:0}
  .dicerow{flex-direction:column;align-items:stretch;gap:0}
  .dicebar,.dtray,.dlog{border-left:0;border-right:0}
  .dicebar{border-bottom:0}
  .dexp{width:34px}
  .dtray{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-bottom:0;padding:7px 9px;gap:7px}
  .dtop{flex:1 1 104px}
  .dsel{flex:2 1 172px}
  .droll{flex:1 1 96px}
  .dlog{max-height:42vh;border-bottom:0}
  .dshow{margin:0 11px 9px}
  body.sheet .dice{display:none}
}
</style>
<header>
  <h1><span class="wm">Vesper</span><span class="wdiv">·</span><span id="hTitle"></span></h1>
  <span class="sub" id="hMode"></span>
  <span class="spacer"></span>
  <span class="sub muted" id="hStamp"></span>
  <div class="hctl">
    <div class="locsel" id="pLoc">
      <button data-l="cs" aria-pressed="true">CS</button><button data-l="en" aria-pressed="false">EN</button>
    </div>
    <div class="pthemes" id="pThemes" title="Colour scheme">
      <button data-t="malachite" style="background:#4fbf8f" aria-label="Malachite"></button>
      <button data-t="slate" style="background:#55919f" aria-label="Slate"></button>
      <button data-t="cinnabar" style="background:#e0573c" aria-label="Cinnabar"></button>
      <button data-t="solar" style="background:#e8b93c" aria-label="Solar"></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="stage">
    <div class="zoomctl">
      <button id="zRuler" class="zruler" aria-label="Measure" aria-pressed="false">&#8596;</button>
      <button id="zOut" aria-label="Zoom out">&minus;</button>
      <span id="zVal">2&times;</span>
      <button id="zIn" aria-label="Zoom in">+</button>
    </div>
    <div class="measurebox hidden" id="measureBox">
      <div class="mb-h">Route</div>
      <div id="mbBody"></div>
      <button class="pbtn" id="mbClear" style="margin-top:7px">Clear route</button>
    </div>
    <div class="field"><div class="stack" id="stack">
      <canvas id="pix"></canvas><canvas id="lbl"></canvas>
    </div></div>
    <canvas class="dvcan" id="dvCan"></canvas>
    <div class="dice" id="dice">
      <div class="dlog hidden" id="dLog"></div>
      <div class="dicerow">
        <div class="dicebar">
          <button class="dexp" id="dExp" aria-expanded="false">&#9650;</button>
          <div class="dticker" id="dTicker"></div>
        </div>
        <div class="dtray">
          <div class="dtop">
            <input type="color" id="dCol" class="dswatch" aria-label="Your dice colour"><input type="text" id="dName" maxlength="16" autocomplete="nickname">
            <button class="dmin" id="dMin">&minus;</button>
          </div>
          <div class="dsel">
            <select id="dCount" aria-label="Dice"></select><span>d</span><select id="dSides" aria-label="Die"></select><select id="dMod" aria-label="Modifier"></select>
          </div>
          <div class="dgate hidden" id="dGate">
            <input type="password" id="dPass" placeholder="Table password" autocomplete="current-password">
            <button id="dPassGo" type="button">Sign in</button>

9":{"t":"ash","k":"blue","r":2},"28,19":{"t":"tundra","k":"blue","r":2},"29,19":{"t":"tundra","k":"blue","r":2}},"directives":[],"wiki":{"entries":[{"t":"Šedá Zóna","c":"Geography","b":"Nárazníková zóna která se táhne napříč [Krant|Krantem] o výšce zhruba 70km podél celé jeho šíře. Po demilitarizaci obou stran v rámci [Agarpolis Dohoda|Agarpolis Dohody] zde vzniklo vakuum které zaplnilo bezpráví a lovci příležitostí. Počet obyvatel zůstalých v zóně se odhaduje v nízkých milionech primárně koncentrovaných v ruinách metropolitních center a venkovských enkláv."},{"t":"Rumea","c":"Geography","b":"Východní region na Vesperu, Rumea je jedním z dvou zemských koridorů spojující [Kolvath] a [Occasia|Ocassii]. Na šíři má délku 1521km. Oplývá velkou diverzitou planin, vysočin a lesů protkaných meandry a skalními útvary."},{"t":"Agarpolis Dohoda","c":"History","b":"Jmenovaná dle Occasijské metropole na severním [Krant|Krantu] ve kterém byla tato dohoda o příměří podepsána 24. srpna 2372 mezi [Kolvath|Kolvathem] a [Occasia|Occasií]. Podmínky dohody stanovily 5 let zemského příměří v Krantu ode dne podpisu smlouvy. Příměří se týká i námořních a vzdušných operací nad Krantem včetně průzkumných operací. Konvenční konflikt v [Rumea|Rumei] nadále pokračuje. Dohoda ustanovila vznik nárazníkové zóny lidově známá jako \"[Šedá Zóna]\" mezi oběma státy o minimální vzdálenosti 70km a její převážné demilitarizaci. Obě strany se shodly, že fronta na Krantu se dostala do bodu mrazu a žádná strana neměla navrch. Pro obě strany vypadá, že se fronta znova otevře po skončení příměří, nové zásobovací linie a obranné základny jsou uváděny to provozuschopného stavu."},{"t":"Poslední válka","c":"History","b":"Ozbrojený konflikt mezi [Kolvath|Kolvathem] a [Occasia|Ocasiií] který začal předběžným útokem ze strany [Kolvath|Kolvathu] v roce 2347 v reakci na kontaminační únik [Zhouba|Zhouby] ze [Stanice Kestrel] v roce 2346 a následnému rozpadu diplomatických relací kvůli způsobené rozsáhlé neúrodě a hladomoru. Ačkoliv se nepodařilo zjistit přesnou příčinu úniku a zda-li v tom figurovaly zpravodajské složky z obou stran ([BSO] nebo [MZK]), relace již byly na bodu mrazu před vypuknutím otevřeného boje a obě strany aktivně zbrojily dekády proti sobě. Názvu \"Poslední válka\" získal tento konflikt primárně jeho velikostí a počtem obětí a zkázy. Odhadem expertů zahynulo mezi oběma stranami v přepočtu 1 bilión obyvatel a dalších 2 bylo vysídleno z postihnutých oblastí. Přestože se válka přesouvá do 30. výročí svého trvání, obě strany nejsou ochotny přistoupit k ukončení bojů vyjma krátkodobého příměří v rámci [Agarpolis dohoda|Agarpolis dohody]."},{"t":"VzSO","c":"History","b":"Vzdušné síly Occasie (zkr. VzSO) jsou jedním ze tří branží centrálního velení ozbrojených sil. Rozdělené na dvě velitelství, Severní a Jižní, primární offenzivní kapacity jsou koncentrovány na severu proti Kolvathu. Jižní velitelství zařizuje logistické zázemí, údržbu flotily a search & rescue operace. Pod VzSO spadají i raketové síly, pozičně situovány na jihu daleko od dosahu strategických bombardérů Kolvathu."},{"t":"Projekt Arcturus","c":"History","b":"Zahájen v roce 2310 po dekádovém summitu mezi Occasií a Kolvathem za účelem eradikace [Zhouba|Zhouby], byla to dosud největší socio-ekonomicko-vědecká spolupráce mezi oběma státy. Kooperace vyústila v sérii labolatoří postavených v [Krant] regionu a značném sdílení civilních technologií obou stran. Po kontaminačním úniku experimentálních prvků [Zhouba|Zhouby] (příčina neznámá) v roce 2346 a následné ekologické katastrofě byla spolupráce pozastavena a po vypuknutí [Poslední válka|Poslední války] o rok později natrvalo zatracena."},{"t":"Vesper","c":"Geography","b":"Systém Aurelius\nHlavní hvězda: Aurelius, žlutá hvězda hlavní posloupnosti spektrální třídy G2V\nVzdálenost od Arcturu: přibližně 4.1 světelného roku\nPlaneta: Vesper, třetí hlavní planeta systému\nOběžná dráha: 1.00 AU\nRok: Přibližně 365 dní\n\n-Geografie-\nVesper je rozlehlá oceánská superplaneta s nezvykle nízkou průměrnou hustotou a povrchovou gravitací blízkou jednomu standardnímu g. Její nitro ukrývá hluboký, na vodu bohatý plášť, nad nímž leží poměrně tenká a rozlámaná kontinentální kůra.\n\nPovrchu světa dominuje Vesperský oceán: chladný, téměř celoplanetární oceán přerušovaný vulkanickými souostrovími, podmořskými hřbety a dvěma hlavními pevninami — Cassem na jihu a Brumou na severu. Cassus je starší, a mírnější kontinent; historické centrum osídlení, zemědělství a lehkého průmyslu. Bruma je obdobná tvarem, avšak značně chladnější: severní štít vysokých plošin, fjordových pobřeží, vnitrozemských moří a sezónního ledu. S Cassem jsou spojeni zemsky mezi dvěma regiony [Krant] a [Rumea]."},{"t":"Occasia","c":"Geography","b":"Occasia (vysloveno Okásie - officiálně Occasijská Republika), je megastátem na jižním polokouli [Vesper|Vesperu] na kontinentu [Cassus]. Na dlouhou historii Vesperu je to mladá republika která vznikla po dlouhém procesu diplomacie mezi městskými státy a kraji v roce 1975 za účelem spolupráce a prosperity. Occasii vyneslo do dob prosperity hlavně pokrok v námořních technologiích, průlom v těžbě v hlubokých vodách, investice do rozšíření biotechnologií a agrárního průmyslu díky nimž populace republiky vyrostla z 1 do 3 biliónů za pouhých 150 let. Lehký průmysl, zemědělství, a výroba a výzkum špičkových technologií jsou výhradně silnou stránkou Occasie která využila jejich potenciálu k podpoře rostoucího obyvatelstva a armády."},{"t":"Kolvath","c":"Geography","b":"Kolvath (oficiálně Federativní Republika Kolvath), je megastát nacházející se na severní polokouli [Vesper|Vesperu] na kontinentě Bruma. První zmínky o vzniku federace sahají zpátky do roku 2050 kdy první pokroky v technologiích umožnilo prvním osadníkům dalekosáhlé výpravy na mrazivý sever Brumy a založení prvních permanentních osad. V rámci vývoje za poslední dvě století se Kolvath přeměnil primárně v centrálně řízenou republiku a federace zůstala jménem. Kolvath obývá zhruba 2.5 biliónů obyvatel (předválečný cenzus) primárně na jeho jižní části sousedící s Occasií. Je domovem silně industrializovaného těžkého průmyslu, hlubokého osvojení geotermální technologie a těžby v arktických podmínkách a vlastní dobře propojenou železniční síť. Industrializace byla silnou stránkou Kolvathu, který dokázal čerpat nezměrné přírodní zdroje nacházející se na severu planety pod ledovým krytem."},{"t":"Krant","c":"Geography","b":"Jeden ze dvou zemských koridorů na Vesperu který propojuje [Cassus] a [Bruma] megakontinenty na [Vesper|Vesperu]. Se šířkou 483km, Krant je bohatý na černozem, byl tedy ideálním kandidátem na to se stát obilnicí v dobách prosperity pro oba státy. Sloužil i jako hlavní logistický koridor pro směnný obchod mezi [Kolvath|Kolvathem] a [Occasia|Occasií]. Předválečná populace regionu pro obě velmoce činila zhruba 300 milionů obyvatel. Po vypuknutí [Poslední válka|války] v roce 2347 se Krant ocitl v středobodu prvních bitev. V roce 2372 byla podepsána [Agarpolis Dohoda] která zmrazila dosavadní linii kontaktu (pouze) v Krantu v napjatém příměří na 5 let. V rámci dohody byla ustanovena tzv. \"[Šedá Zóna]\" dělící oba státy v tomto regionu."},{"t":"MZK","c":"Misc","b":"Ministerstvo Zpravodajství Kolvath (zkráceně MZK) je zpravodajským orgánem Kolvathu. Je přímým rivalem [BSO] a jelikož vzniklo později než [BSO], přebralo své operační techniky přímo od nich."},{"t":"BSO","c":"Misc","b":"Bezpečnostní Služba Occasie (zkráceně BSO) je hlavní zpravodajská paže Occasie. Založena za dob první republiky má za sebou dlouhou historii vlivu na technologický vývoj a informační přehled na jižním kontinentu Occasie. Její schopnosti jsou přímým rivalem [MZK]."},{"t":"Zhouba","c":"History","b":"Prvně spatřena v roce 2301 na jižní části Occasie, Zhouba jako taková postihla prvně obiloviny a v dalších dekádách se postupně začala mutovat a šířit na ostatní plodiny. Původem neznámá, první teorie o jejím vývoji a šíření padly na [Kolvath], [BSO] ovšem tato tvrzení zpochybnila, nic nenasvědčovalo nekalému jednání ze strany Kolvathu. Na společném dekádovém summitu v roce 2310 [Kolvath] otevřel diskusi o ekologických katastrofách, jelikož evidentně Zhouba postihla i [Kolvath] v prvních letech nového století.\nSpolupráce v rámci průzkumu Zhouby a jejím zpětném inženýrství vyústila v [Projekt Arcturus]. První labolatoř [Stanice Kolvasia] byla dostavena v roce 2320 a do roku 2347 byla jedním z opěrných bodů projektu. Další důležitou stanicí v rámci projektu byla [Stanice Kestrel] a ... [KLASIFIKOVÁNO]"}],"sites":[{"t":"Základna Železný Kříž","x":"1202","m":"red","b":"Hlavní logistický uzel a vojenská letecká základna a pevnost Kolvathu v Krant regionu. Silně opevněná, vyzbrojená protiletadlovou ochranou a klíčovým bodem obrany.","k":false},{"t":"Stanice Kolvasia","x":"1408","m":"lab","b":"První výzkumná stanice Projektu Arcturus vybudovaná v roce 2320 a uvedena do provozu o rok později vznikla jako společné úsilí obou národních států. Stanice byla tedy pokřtěna spojením obou jejich jmen - Kolvathu a Occasia. Po vypuknutí války v roce 2347 byla značná část stanice zničena sabotáží obou týmů ve snaze znemožnit druhé straně možnost evakuace důležitých dokumentů. Dle informací z průzkumných letů vypadá stanice opuštěně.","k":false},{"t":"Stanice Kestrel","x":"2710","m":"lab","b":"Výzkumná stanice Kestrel, zatracena na začátku \"Poslední války\". Vedla výzkum Projektu Arcturus.","k":false},{"t":"Kemp Liptus","x":"1711","m":"enclave","b":"","k":false},{"t":"Předsunutá Základa Voyager","x":"1512","m":"fob","b":"Váš nový domov po době této mise. Zařízen vším co Occasie může nabídnout.","k":false},{"t":"Zásobovací Konvoj","x":"1513","m":"unknown","b":"Konvoj se zásobami měl dorazit do Středostanice 4 ale ztratil kontakt.","k":true},{"t":"Rangon City","x":"1016","m":"enclave","b":"Převálečná metropolis o původním počtu 3 milionů obyvatel zredukovaná na ruiny a suť v bitvě o Rangon City v roce 2355. Nyní přeživší kolonie pozůstalých obyvatel s neutrální vazbou na Occasii.","k":false},{"t":"","x":"3017","m":"fob","b":"","k":false},{"t":"","x":"0418","m":"fob","b":"","k":false},{"t":"","x":"0618","m":"fob","b":"","k":false},{"t":"Agarpolis","x":"0419","m":"enclave","b":"","k":false},{"t":"Základna Kotvia","x":"2019","m":"fob","b":"","k":false},{"t":"Seamuth","x":"0220","m":"enclave","b":"","k":false}]},"theme":"malachite","themeVars":{},"themeCanvas":{"void":"#07120d","edge":"#1d3a2e","fog":"#173029","wave":"#5fd39a","grade":[44,122,88,0.15],"rulerBg":"#0c1c15","tickMaj":"#3d6a58","tickMin":"#1c3a2e","rulerText":"#85ab97","waveBg":"#08150f","waveMid":"#1c3a2b","waveSel":"rgba(79,191,143,.22)","head":"#e8f6ec","placeholder":"#4a6b5b"},"themes":{"malachite":{},"slate":{"--void":"#0b1116","--panel":"#151f27","--panel2":"#1b2831","--panel3":"#0e161c","--line":"#2b3b47","--line2":"#1c2830","--bone":"#93a6ae","--dim":"#61757f","--bright":"#d5e0e4","--accent":"#55919f","--accent-bg":"#1f3039","--accent-hi":"#8fd8e8","--accent-soft":"rgba(85,145,159,.14)","--amber":"#c9924a","--oxide":"#b8542a","--trough":"#0f171d","--thumb":"#2f414e","--thumb-hi":"#3f5766","--float":"rgba(17,26,33,.95)"},"cinnabar":{"--void":"#120809","--panel":"#211012","--panel2":"#2c181a","--panel3":"#180b0d","--line":"#4a2529","--line2":"#2a1518","--bone":"#bd9691","--dim":"#8b625e","--bright":"#f2dcd7","--accent":"#e0573c","--accent-bg":"#3a1a14","--accent-hi":"#ff8f76","--accent-soft":"rgba(224,87,60,.15)","--amber":"#d9a04a","--oxide":"#c0442a","--trough":"#150a0b","--thumb":"#4a2a28","--thumb-hi":"#66403c","--float":"rgba(28,15,16,.95)"},"solar":{"--void":"#12100a","--panel":"#1e1a11","--panel2":"#292316","--panel3":"#171308","--line":"#4a3f22","--line2":"#2b2415","--bone":"#bbab7c","--dim":"#8a7a52","--bright":"#f2e7c8","--accent":"#e8b93c","--accent-bg":"#3a2f12","--accent-hi":"#ffe08a","--accent-soft":"rgba(232,185,60,.15)","--amber":"#e07a2b","--oxide":"#c85a2a","--trough":"#161208","--thumb":"#4d4126","--thum function cubeToOff(cu){return {col:cu.x+((cu.z-(cu.z&1))/2),row:cu.z};}
function cubeRound(x,y,z){
  var rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  var dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;

function hexLine(a,b){

  var N=Math.max(Math.abs(A.x-B.x),Math.abs(A.y-B.y),Math.abs(A.z-B.z));

    out.push(cubeToOff(cubeRound(
      A.x+(B.x-A.x)*t+1e-6,A.y+(B.y-A.y)*t+1e-6,A.z+(B.z-A.z)*t-2e-6)));

    function(m,target,label){

    for(bi=0;bi<dvCast[ci].bits.length;bi++)draw.push(dvCast[ci].bits[bi]);

function dAnimate(rec,done){
  var host=document.querySelector("#dTicker .dent");
  var quiet=false;
  try{quiet=matchMedia("(prefers-reduced-motion:reduce)").matches;}catch(e){}
  if(!host||quiet)return done();
  var chips=Array.prototype.slice.call(host.querySelectorAll(".dface"));
  var tot=host.querySelector(".dtot");
  if(!chips.length||!tot)return done();
  host.classList.add("rolling");
  chips.forEach(function(c){c.classList.remove("set");});
  var t0=Date.now(),settle=chips.map(function(c,i){return 330+i*95+Math.random()*70;});
  var last=Math.max.apply(null,settle)+110;
  (function step(){
    var el=Date.now()-t0,sum=rec.m,all=true;
    chips.forEach(function(c,i){
      if(el<settle[i]){
        all=false;
        var v=dRand(rec.s);
        c.textContent=v;sum+=v;
        c.style.transform="translateY("+(Math.sin(el/34+i*2)*2.5).toFixed(2)+"px)";
      }else{
        if(!c.classList.contains("set")){
          c.classList.add("set");c.textContent=rec.f[i];c.style.transform="";
        }
        sum+=rec.f[i];
      }
    });
    tot.textContent=all?rec.t:sum;
    if(el<last)requestAnimationFrame(step);
    else{
      tot.textContent=rec.t;
      host.classList.remove("rolling");host.classList.add("landed");
      setTimeout(function(){host.classList.remove("landed");},480);
      done();
    }
  })();
}

  var quiet=false;

    run.onfinish=function(){e.style.overflow="";};

}

function dGateRender(){
  var g=function(i){return document.getElementById(i);};
  var btn=g("dRoll"),gate=g("dGate");
  if(!btn||!gate)return;
  var locked=!!dGateCfg&&!dSignedIn;
  btn.classList.toggle("locked",locked);
  btn.textContent=locked?T("signInToRoll"):T("roll");
  if(!locked)gate.classList.add("hidden");
  /* Naming the account here makes the commonest failure obvious: the address
     in the file not matching the one created in the console. */
  var f=g("dPass");
  if(f&&dGateCfg)f.placeholder=T("passFor")+" "+dGateCfg.user;
}
function dGateOpen(){
  var g=document.getElementById("dGate");
  if(!g)return;
  g.classList.remove("hidden");
  var f=document.getElementById("dPass");
  if(f)f.focus();
}
function dGateTry(){
  var pass=document.getElementById("dPass"),msg=document.getElementById("dGateMsg");
  if(!dGateCfg||dGateBusy||!pass)return;
  var pw=pass.value;
  if(!pw){msg.textContent=T("needPass");return;}
  dGateBusy=true;msg.textContent=T("signingIn");
  var base="https://www.gstatic.com/firebasejs/10.12.5/";
  Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js")])
    .then(function(m){
      var app=m[0].getApps&&m[0].getApps().length?m[0].getApps()[0]
             :m[0].initializeApp({apiKey:dGateCfg.key,databaseURL:dGateCfg.url,
                                  authDomain:dGateCfg.domain});
      return m[1].signInWithEmailAndPassword(m[1].getAuth(app),dGateCfg.user,pw);
    })
    .then(function(){
      dGateBusy=false;pass.value="";msg.textContent="";
      dSignedIn=true;dGateRender();dSyncConnect();
    })["catch"](function(err){
      dGateBusy=false;
      var code=String(err&&err.code||err&&err.message||"?");
      /* Firebase collapses "wrong password" and "no such account" into one
         code, so the code itself goes on screen rather than a guess at it. */
      var why=T("signInFailed");
      if(code.indexOf("operation-not-allowed")>=0)why=T("noProvider");
      else if(code.indexOf("api-key")>=0)why=T("badKey");
      else if(code.indexOf("too-many-requests")>=0)why=T("tooMany");
      else if(code.indexOf("invalid-credential")>=0||code.indexOf("wrong-password")>=0||
              code.indexOf("user-not-found")>=0)why=T("badLogin");
      msg.textContent=why+"  ("+code+")";
      if(window.console&&console.warn)console.warn("dice sign-in:",err);
    });
}
function dSyncInit(){
  var url="";
  try{url=new URLSearchParams(location.search).get("dice")||"";}catch(e){}
  try{
    if(url)localStorage.setItem("vesper:dicesync",url);
    else url=localStorage.getItem("vesper:dicesync")||"";
  }catch(e){}
  var cfgObj=DATA.diceSync;
  url=(url||(cfgObj&&typeof cfgObj==="object"?cfgObj.databaseURL:cfgObj)||
       DICECFG.databaseURL||"").replace(/\/+$/,"");
  if(!url||!/^https:\/\//.test(url))return;
  dSyncUrl=url;
  var room=String(DATA.title||"table").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"table";
  var key="",user="",domain="";
  try{
    var qs=new URLSearchParams(location.search);
    key=qs.get("dkey")||"";user=qs.get("duser")||"";
    /* Remembered the same way the database link is, so a key handed out on the
       URL only has to be clicked once — and never has to sit in the repo. */
    if(key)localStorage.setItem("vesper:dicekey",key);
    else key=localStorage.getItem("vesper:dicekey")||"";
    if(user)localStorage.setItem("vesper:diceuser",user);
    else user=localStorage.getItem("vesper:diceuser")||"";
  }catch(e){}
  var cfg=DATA.diceSync;
  if(cfg&&typeof cfg==="object"){
    key=key||cfg.apiKey||"";user=user||cfg.user||"";domain=cfg.authDomain||"";
  }
  key=key||DICECFG.apiKey||"";user=user||DICECFG.user||"";
  if(!domain){
    /* dice-tracker-bd919-default-rtdb.europe-west1... -> dice-tracker-bd919 */
    var host=url.replace(/^https:\/\//,"").split("/")[0];
    var proj=host.split(".")[0].replace(/-default-rtdb$/,"");
    if(proj)domain=proj+".firebaseapp.com";
  }
  if(key){
    /* Firebase does the checking, so nothing here has to be kept secret. */
    dGateCfg={url:url,key:key,user:(user||"table@vesper.game").trim(),
              domain:domain||undefined};
    dSyncRoom=room;
    dGateRender();
    dSyncWatch();
    return;
  }
  dSyncRoom=room;dSyncConnect();
}
var dSyncRoom="";
/* If the browser still holds a token from last time, come straight in. */
function dSyncWatch(){
  var base="https://www.gstatic.com/firebasejs/10.12.5/";
  Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js")])
    .then(function(m){
      var app=m[0].getApps&&m[0].getApps().length?m[0].getApps()[0]
             :m[0].initializeApp({apiKey:dGateCfg.key,databaseURL:dGateCfg.url,
                                  authDomain:dGateCfg.domain});
      m[1].onAuthStateChanged(m[1].getAuth(app),function(u){
        if(u&&!dSignedIn){dSignedIn=true;dGateRender();dSyncConnect();}
      });
    })["catch"](function(){});
}
function dSyncConnect(){
  var url=dGateCfg?dGateCfg.url:dSyncUrl,room=dSyncRoom;
  var base="https://www.gstatic.com/firebasejs/10.12.5/";
  Promise.all([import(base+"firebase-app.js"),import(base+"firebase-database.js")])
    .then(function(mods){
      var app=mods[0].getApps&&mods[0].getApps().length?mods[0].getApps()[0]
             :mods[0].initializeApp(dGateCfg
                ?{apiKey:dGateCfg.key,databaseURL:url,authDomain:dGateCfg.domain}
                :{databaseURL:url});
      var db=mods[1].getDatabase(app);
      var list=mods[1].ref(db,"vesper/"+room+"/rolls");
      var first=true;
      mods[1].onValue(mods[1].query(list,mods[1].limitToLast(DKEEP)),function(sn){
        var out=[],arriving=[];
        sn.forEach(function(c){
          var v=c.val()||{};v.id=c.key;out.push(v);
          if(dvSeen[c.key])return;
          dvSeen[c.key]=1;
          if(!first&&v.cid!==DCID&&v.f&&v.f.length)arriving.push(v);
        });
        first=false;
        /* Straight onto the table, whatever else is already in the air. At a
           group check everybody rolls at once, and holding one back would be a
           lie about what happened. */
        arriving.forEach(function(v){dvThrow(v,null);});
        if(dRolling){dPending=out;return;}
        dLog=out;dTickerRender();dLogRender();
      });
      dSyncPush=function(rec){
        try{rec?mods[1].push(list,rec):mods[1].remove(list);}catch(e){}
      };
      dLog=[];dTickerRender();
    })["catch"](function(){});
}
function dModeRender(){var b=document.getElementById("dMode");if(!b)return;var on=dvWant();b.textContent=on?"3D: ON":"3D: OFF";b.title=on?"3D throw enabled — click for instant result":"Instant result enabled — click for 3D throw";b.setAttribute("aria-pressed",on?"true":"false");}
function diceInit(){
  if(dReady)return;
  var g=function(id){return document.getElementById(id);};
  var cnt=g("dCount"),sid=g("dSides"),mod=g("dMod"),nm=g("dName"),btn=g("dRoll");
  if(!cnt||!sid||!mod||!nm||!btn)return;
  dReady=true;
  var i,o;
  var add=function(sel,val,txt){
    o=document.createElement("option");o.value=val;o.textContent=txt;sel.appendChild(o);
  };
  for(i=1;i<=10;i++)add(cnt,i,i);
  DSIDES.forEach(function(s){add(sid,s,s);});
  for(i=-5;i<=10;i++)add(mod,i,(i>0?"+":"")+i);
  var pref={};
  try{pref=JSON.parse(localStorage.getItem("vesper:dice")||"{}")||{};}catch(e){}
  try{
    var saved=JSON.parse(localStorage.getItem("vesper:rolls")||"[]");
    if(saved instanceof Array)dLog=saved.slice(-DKEEP);
  }catch(e){}
  cnt.value=pref.n||1;sid.value=pref.s||20;
  mod.value=(pref.m===undefined?0:pref.m);nm.value=pref.who||"";
  btn.onclick=function(){
    if(dGateCfg&&!dSignedIn){dGateOpen();return;}
    dThrow();
  };
  var pg=g("dPassGo"),pf=g("dPass");
  if(pg)pg.onclick=dGateTry;
  if(pf)pf.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();dGateTry();}};
  g("dMode").onclick=function(){if(dRolling)return;try{localStorage.setItem("vesper:diceboard",dvWant()?"0":"1");}catch(e){}dModeRender();};
  nm.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();dThrow();}};
  var sw=g("dCol");
  if(sw){
    sw.value=dColour();
    sw.oninput=function(){
      try{localStorage.setItem("vesper:dicecol",sw.value);}catch(e){}
    };
  }
  g("dExp").onclick=function(){
    var box=g("dLog"),open=box.classList.toggle("hidden")===false;
    this.setAttribute("aria-expanded",open);
    this.innerHTML=open?"&#9660;":"&#9650;";
    if(open)dLogRender();
  };
  var mini=function(on){
    g("dice").classList.toggle("min",on);
    try{localStorage.setItem("vesper:dicemin",on?"1":"");}catch(e){}
    fieldPad();
  };
  g("dMin").onclick=function(){mini(true);};
  g("dShow").onclick=function(){mini(false);};
  try{if(localStorage.getItem("vesper:dicemin"))g("dice").classList.add("min");}catch(e){}
  dvCan=g("dvCan");
  if(dvCan&&dvCan.getContext){dvCtx=dvCan.getContext("2d");dvSize();}
  else dvCan=null;
  window.addEventListener("resize",function(){if(dvCast.length)dvSize();});
  diceLocale();dModeRender();dTickerRender();dLogRender();dSyncInit();
}
/* The panel docks to the bottom on a phone, so the dice have to sit above it. */
function dockH(){
  var h=0;
  if(narrow()){
    var gr=document.getElementById("sheetGrip"),tb=document.querySelector(".tabs");
    h=(gr?gr.offsetHeight:0)+(tb?tb.offsetHeight:0);
  }
  document.documentElement.style.setProperty("--dockh",h+"px");
  fieldPad();
}
/* Enough room under the map to scroll its bottom edge clear of the dice, but
   only when the map is long enough to need it. Otherwise a zoomed-out map
   would sit above a band of nothing. */
function fieldPad(){
  var f=document.querySelector(".field"),st=document.getElementById("stack"),
      dz=document.getElementById("dice");
  if(!f||!st||!dz)return;
  var dock=parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue("--dockh"))||0;
  var base=narrow()?0:16;
  var clear=Math.round(dz.getBoundingClientRect().height)+(narrow()?dock:14)+12;
  f.style.paddingBottom=(st.offsetHeight+base>f.clientHeight-clear?clear:base)+"px";
}
window.addEventListener("resize",dockH);
try{new ResizeObserver(fieldPad).observe(document.getElementById("stack"));}catch(e){}
function boot(){
  applyPlayerTheme(pickTheme());
  document.getElementById("hTitle").textContent=DATA.title||T("regionMap");
  document.title="Vesper · "+(DATA.title||"Region map");
  sizeCanvas();render();legend();briefings();renderWiki("");
  Array.prototype.forEach.call(document.querySelectorAll("#pThemes button"),function(b){
    b.onclick=function(){applyPlayerTheme(b.dataset.t);render();};
  });
  applyPlayerTheme(curTheme);
  Array.prototype.forEach.call(document.querySelectorAll("#pLoc button"),function(b){
    b.onclick=function(){applyLocale(b.dataset.l);};
  });
  applyLocale(LOC);
  var wf=document.getElementById("wikiFind");
  if(wf)wf.oninput=function(){renderWiki(wf.value);};
  /* No wiki content means no wiki tab — an empty tab is worse than none. */
  var W=DATA.wiki||{};
  if(!((W.entries||[]).length+(W.sites||[]).length)){
    var wb=document.querySelector('.tabs button[data-t="wiki"]');
    if(wb)wb.style.display="none";
  }
}
boot();
diceInit();
dockH();
/* If a map.json sits beside this file (e.g. on GitHub Pages), prefer it —
   the GM updates one small file and players just refresh. Fails silently
   when opened straight off disk, which is the standalone case. */
if(typeof fetch==="function"){
  fetch("map.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;})
    .then(function(j){ if(j&&j.hexes&&j.cols){DATA=j;sel=null;boot();
        document.getElementById("hStamp").textContent=T("live");} })
    .catch(function(){});
}

/* Reliable in-memory 3D/instant preference; persistence is optional. */
var dvModeMemory=dvWant();
dvWant=function(){return dvModeMemory;};
dModeRender=function(){var b=document.getElementById("dMode");if(!b)return;b.textContent=dvModeMemory?"3D: ON":"3D: OFF";b.title=dvModeMemory?"3D throw enabled — click for instant result":"Instant result enabled — click for 3D throw";b.setAttribute("aria-pressed",dvModeMemory?"true":"false");};
(function(){var b=document.getElementById("dMode");if(!b)return;b.onclick=function(){if(dRolling)return;dvModeMemory=!dvModeMemory;try{localStorage.setItem("vesper:diceboard",dvModeMemory?"1":"0");}catch(e){}dModeRender();};dModeRender();})();
})();
</script>
